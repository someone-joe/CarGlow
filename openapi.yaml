openapi: 3.0.3

# =============================================================================
# 夜间代客洗车平台 API 契约（SSOT · 唯一事实来源）
#
# 本文件是前后端接口的唯一定义处。
#   - 前端：npx openapi-typescript openapi.yaml -o carwash-mp/src/api/schema.d.ts
#   - 后端：openapi-generator generate -i openapi.yaml -g spring -o build/generated
#          （V1.0 先用 springdoc 生成实际文档与本文件做 diff 校验）
# 任何接口变更必须先改本文件，再改代码。字段不一致 = 漂移，必须修到一致。
#
# 上游：《洗车项目PRD V2.0》第六章；《洗车项目技术方案.md》第六章；《订单状态机规则表.md》
# =============================================================================

info:
  title: 夜间代客洗车平台 API
  version: 1.0.0
  description: |
    V1.0 MVP 接口契约。

    **全局约定**
    - 金额：整数，单位【分】。前端展示时除以 100。
    - 时间：毫秒时间戳（number）。时区 Asia/Shanghai。
    - 统一响应体 `{ code, msg, data }`，code = 0 表示成功，非 0 为错误码。
    - 分页响应：data = `{ list, total, pageNum, pageSize }`。
    - 幂等：下单、支付、开箱、分配格口四类接口必须传 `Idempotency-Key` 请求头。

    **路径前缀**
    - `/api/v1/**` C 端与师傅端小程序（wx-token / worker-token 鉴权）
    - `/admin-api/**` 运营后台（若依 JWT 鉴权，返回体沿用若依结构，见下条）
    - `/device-callback/v1/**` 钥匙柜回调（签名 + IP 白名单，见 x-roadmap）

    **后台通道与 `/api/v1` 的两处差异（不统一，勿混用）**
    1. 成功码：后台 `code = 200`，小程序端 `code = 0`。
       原因是后台必须零改造复用若依 `AjaxResult` / `TableDataInfo`，
       否则 RuoYi-Vue3 的请求拦截器（`code === 200`）会把成功响应当错误处理。
    2. 分页：后台返回平铺的 `{ total, rows, code, msg }`（若依 `TableDataInfo`），
       不是小程序端的 `data = { list, total, pageNum, pageSize }`。
    3. 业务错误：后台沿用若依 `AjaxResult.error(msg)`（HTTP 200 + 业务失败码），
       不走 x-error-codes 的字母分段映射。
  contact:
    name: CarGlow

servers:
  - url: https://{host}
    variables:
      host:
        default: api.carglow.local
        description: 部署域名，上线后替换

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 登录授权
  - name: site
    description: 站点 / 小区 / Banner
  - name: goods
    description: 服务分类与服务项
  - name: cabinet
    description: 钥匙柜与格口
  - name: vehicle
    description: 车辆管理
  - name: order
    description: 下单 / 订单 / 进度
  - name: pay
    description: 支付
  - name: aftersale
    description: 评价 / 售后 / 理赔
  - name: misc
    description: 客服 / 条款等配置
  - name: coupon
    description: C 端优惠券（领券中心 / 我的券 / 下单最优券）
  - name: insurance
    description: C 端保险（产品 / 投保 / 我的保单）
  - name: admin-order
    description: 后台订单管理（列表 / 详情 / 人工干预）
  - name: admin-worker
  - name: admin-site
  - name: admin-community
    description: 后台师傅（工作人员）管理
  - name: admin-member
    description: 后台会员与车辆查询
  - name: admin-goods
    description: 后台服务项（商品）配置
  - name: admin-dashboard
    description: 后台经营数据看板

# -----------------------------------------------------------------------------
# 错误码（分段：A0 通用 / B1 订单 / B2 柜机格口 / B3 支付 / B4 任务 / C0 第三方 / C1 营销 / C2 保险）
# -----------------------------------------------------------------------------
x-error-codes:
  A0001: 参数错误
  A0002: 未登录或登录已过期
  A0003: 无权限
  A0004: 请求过于频繁
  A0005: 系统繁忙，请稍后重试
  A0006: 当晚产能已满，请改约其他日期
  B1001: 订单不存在
  B1002: 订单状态不允许该操作
  B1003: 未到存钥匙时间 / 已过截止时间
  B1004: 取消原因必填
  B1005: 影像不存在、或不属于当前订单 / 当前会员（防 fileId 伪造与跨单复用）
  B2001: 柜机离线
  B2002: 格口已被占用
  B2003: 无空闲格口
  B2004: 开箱码无效或已失效
  B2005: 开箱失败，请重试或联系客服
  B3001: 支付超时
  B3002: 支付失败
  B3003: 退款失败
  B4001: 任务已被他人接单
  B4002: 照片数量不足
  C0001: 第三方服务异常
  C1001: 优惠券已领完或已下架
  C1002: 超过每人领取上限
  C1003: 优惠券不可用（已使用/已过期/不满足门槛）
  C2001: 保险产品不存在或已下架
  C2002: 投保车辆必填
  # ---------------- 师傅端（工作人员）错误码（D 段 → 数字前缀 4） ----------------
  D4001: 工号不存在
  D4002: 密码或验证码错误
  D4003: 师傅账号已被禁用
  D4004: 师傅未绑定站点
  D4005: 工号已被占用（师傅管理新增 / 改工号时唯一性冲突）
  D4006: 师傅不存在（后台按 workerId 查询）

# -----------------------------------------------------------------------------
# 后续模块开工前必须先补契约（防止边写边定，导致漂移）
# -----------------------------------------------------------------------------
x-roadmap:
  - 师傅端（取送）/api/v1/pick/** ：任务池、接单、取车/还车打卡、异常上报、工作量
  - 师傅端（作业）/api/v1/station/** ：工位队列看板、15 步 SOP 打卡、质检、产能预警
  - 设备回调 /device-callback/v1/** ：注册心跳、格口状态同步、开箱回调、开关门上报、故障告警
  - '[已补录，见 tag admin-*] 后台 /admin-api/wash/** ：订单管理、会员/车辆、服务项配置、经营看板，共 15 个接口'
  - '[已补录，见 tag admin-worker] 后台师傅管理 /admin-api/wash/worker/** ：列表 / 详情 / 新增 / 修改 / 删除 / 重置密码 / 字典项'
  - 后台尚未开工的模块（开工前必须先补契约）：站点/小区管理、优惠券管理、工位 bay 与 SOP 明细、复盘工单

paths:
  # ============================ 登录授权 ============================
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 微信小程序登录
      description: code2session 换 openid/unionid，返回访问令牌。首次登录返回是否需弹协议。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: wx.login 获取的临时凭证
                phoneCode:
                  type: string
                  description: 手机号快速验证组件 code，未授权手机号时不传
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginVO'

  /api/v1/worker/login:
    post:
      tags: [worker]
      summary: 师傅工号登录
      description: |
        师傅端入口。工号 + 密码登录（MVP 先密码，后续可换短信码）。
        返回带 role=WORKER 的访问令牌，与 C 端微信登录令牌隔离。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerNo, password]
              properties:
                workerNo: { type: string, description: 工号 }
                password: { type: string, description: 登录密码 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WorkerLoginVO'

  /api/v1/worker/profile:
    get:
      tags: [worker]
      summary: 师傅档案 + 状态聚合（打卡 / 资质 / 在班 / 进行中单量）
      description: |
        师傅端「我的」页聚合信息。qualificationPassed 决定是否允许接单；
        onDutyToday 由排班表算（没配排班视为不限）；activeOrderCount 用于负载展示。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkerProfileVO' }

  /api/v1/worker/work-status:
    post:
      tags: [worker]
      summary: 打卡上下班
      description: |
        本人操作，OFFLINE / ONLINE / BUSY 三态切换。BUSY 表示在忙但仍在线（可按需派）。
        只有 ONLINE / BUSY 才进入派单候选；下班后即便资质齐全也不再接单。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workStatus]
              properties:
                workStatus: { type: string, enum: [OFFLINE, ONLINE, BUSY] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          workStatus: { type: string, enum: [OFFLINE, ONLINE, BUSY] }

  /api/v1/worker/qualification:
    get:
      tags: [worker]
      summary: 我的资质（未提交时返回空态 submitted=false）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkerQualificationVO' }
    post:
      tags: [worker]
      summary: 提交 / 重新提交资质（身份证 + 驾照）
      description: |
        提交后审核回到 PENDING，人脸核身结果保留（本人脸不会变）。
        重新提交会覆盖证件信息并重新送审。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idName, idNo, idFrontFile, idBackFile]
              properties:
                idName: { type: string, description: 身份证姓名 }
                idNo: { type: string, description: 身份证号 }
                idFrontFile: { type: string, description: 身份证正面照 fileId }
                idBackFile: { type: string, description: 身份证反面照 fileId }
                licenseFile: { type: string, description: 驾照照 fileId（选填） }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/worker/media/upload:
    post:
      tags: [worker]
      summary: 师傅影像上传（资质照片）
      description: 走 worker 鉴权，bizType 仅 WORKER_QUAL；照片不挂订单，由前端在提交资质时带上 fileId。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, bizType]
              properties:
                file: { type: string, format: binary }
                bizType: { type: string, enum: [WORKER_QUAL] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MediaVO' }

  /api/v1/worker/media/{fileId}/raw:
    get:
      tags: [worker]
      summary: 师傅读取已上传的资质照片（worker 鉴权）
      description: 与会员 / 后台影像读取走不同拦截器；worker 身份才能读取。
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 图片字节流
          content:
            image/*:
              schema: { type: string, format: binary }
        '404':
          description: 文件不存在

  /api/v1/auth/agreements:
    get:
      tags: [auth]
      summary: 获取协议富文本
      security: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [SERVICE, PRIVACY, RECHARGE, INSURANCE]
            description: 服务条款 / 隐私政策 / 充值协议 / 保险与理赔说明
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          title: { type: string }
                          content: { type: string, description: 富文本 HTML }

  # ============================ 站点 / 小区 ============================
  /api/v1/site/current:
    get:
      tags: [site]
      summary: 当前站点与小区信息
      description: 对应 PRD P1 顶部站点栏「泷景花园 · 泷景中央站」
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SiteVO'

  /api/v1/communities:
    get:
      tags: [site]
      summary: 已开通小区列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CommunityVO'

  /api/v1/community-applies:
    post:
      tags: [site]
      summary: 申请开通我的小区
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [communityName]
              properties:
                communityName: { type: string }
                contactPhone: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/banners:
    get:
      tags: [site]
      summary: 首页 Banner 与公告
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BannerVO'

  /api/v1/capacity:
    get:
      tags: [site]
      summary: 今晚剩余产能
      description: 对应 PRD P1 产能条「今晚剩余 8 个名额 · 最晚 23:00 存钥匙」
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
            description: 默认今天
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CapacityVO'

  # ============================ 服务商品 ============================
  /api/v1/service-categories:
    get:
      tags: [goods]
      summary: 服务分类（洗车服务 / 美容服务）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceCategoryVO'

  /api/v1/services:
    get:
      tags: [goods]
      summary: 服务项列表
      parameters:
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
        - name: scene
          in: query
          description: |
            入口场景。UNSENSITIVE 无感洗车（按次/套餐计价）/ SELFWASH 自助洗车（按计时计价，价格见 /api/v1/selfwash/pricing）。
            传场景时返回该场景专属 + ALL 通用；不传返回全部。
          schema:
            type: string
            enum: [UNSENSITIVE, SELFWASH]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceVO'

  /api/v1/services/{serviceId}:
    get:
      tags: [goods]
      summary: 服务项详情
      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceDetailVO'

  # ============================ 钥匙柜 ============================
  /api/v1/cabinets:
    get:
      tags: [cabinet]
      summary: 机柜列表（含空闲格口数与距离）
      parameters:
        - $ref: '#/components/parameters/CommunityId'
        - name: keyword
          in: query
          description: 楼栋/单元模糊搜索
          schema: { type: string }
        - name: lng
          in: query
          schema: { type: number }
        - name: lat
          in: query
          schema: { type: number }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CabinetVO'

  # ============================ 车辆 ============================
  /api/v1/vehicles:
    get:
      tags: [vehicle]
      summary: 我的车辆列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VehicleVO'
    post:
      tags: [vehicle]
      summary: 新增车辆
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/vehicles/{vehicleId}:
    put:
      tags: [vehicle]
      summary: 修改车辆
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
    delete:
      tags: [vehicle]
      summary: 删除车辆（前端需二次确认）
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # ============================ 常用停车位置 ============================
  /api/v1/park-locations:
    get:
      tags: [park]
      summary: 我的常用停车位置
      description: 只返回当前登录会员的位置，默认位置在前。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            locationId: { type: integer, format: int64 }
                            communityId: { type: integer, format: int64 }
                            communityName: { type: string }
                            building: { type: string, description: '楼栋/单元号' }
                            parkingNo: { type: string, description: '车位号' }
                            detail: { type: string, description: '具体位置补充' }
                            isDefault: { type: string, description: 'Y/N' }
    post:
      tags: [park]
      summary: 新增常用停车位置
      description: communityId 必填（所在小区）；isDefault=Y 时自动取消其它默认。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [communityId]
              properties:
                communityId: { type: integer, format: int64 }
                communityName: { type: string }
                building: { type: string }
                parkingNo: { type: string }
                detail: { type: string }
                isDefault: { type: string, description: 'Y/N' }
      responses:
        '200':
          description: 成功（data 为新建位置ID）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/park-locations/{locationId}:
    put:
      tags: [park]
      summary: 修改常用停车位置
      parameters:
        - name: locationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                communityId: { type: integer, format: int64 }
                communityName: { type: string }
                building: { type: string }
                parkingNo: { type: string }
                detail: { type: string }
                isDefault: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
    delete:
      tags: [park]
      summary: 删除常用停车位置
      parameters:
        - name: locationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # ============================ 自助洗车 ============================
  /api/v1/selfwash/pricing:
    get:
      tags: [selfwash]
      summary: 自助洗车计时计价参数（免登录）
      description: |
        自助按计时收费（与无感的「按次/套餐」不同）：
        baseAmount 分 / baseMinutes 分钟 起收，超过后按 overtimeAmount 分 / overtimeMinutes 分钟 计。
        金额单位分，时长单位分钟。默认 2000 分 / 30 分钟，超时 800 分 / 10 分钟；后台可改。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          baseAmount: { type: integer, format: int64, description: '基础金额（分）' }
                          baseMinutes: { type: integer, description: '基础时长（分钟）' }
                          overtimeAmount: { type: integer, format: int64, description: '超时金额（分）' }
                          overtimeMinutes: { type: integer, description: '超时时长（分钟）' }

  /api/v1/selfwash/workstations:
    get:
      tags: [selfwash]
      summary: 自助工位列表（带实时状态）
      description: |
        siteId 传当前站点。status：IDLE 空闲 / SERVING 服务中 / DISABLED 停用。
        排队明细 / 等待估算随自助订单（Stage 2）补充；出于隐私，车牌一律下发脱敏形式（如 京A***12），不下发订单号与完整车牌。
      parameters:
        - name: siteId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            workstationId: { type: integer, format: int64 }
                            siteId: { type: integer, format: int64 }
                            code: { type: string }
                            name: { type: string }
                            status: { type: string, description: 'IDLE/SERVING/DISABLED' }
                            enabled: { type: string }
                            remainingSeconds: { type: integer, format: int64, description: '服务中剩余秒' }
                            queueCount: { type: integer, description: '该工位当前排队人数（排队中订单数，不含服务中）' }
                            estimatedWaitMinutes:
                              type: integer
                              description: '预计等待分钟 = 服务中剩余秒 + 各排队单总时长（付费时长+加时），向上取整；加时后动态变化，空闲为 0'
                            queueItems:
                              type: array
                              description: '该工位服务中+排队中订单明细（服务中在前，按排队顺序），用于排队进度弹窗；车牌脱敏下发'
                              items:
                                type: object
                                properties:
                                  plateNo: { type: string, description: '脱敏车牌，如 京A***12；无车牌显示 ***' }
                                  serviceName: { type: string, description: '服务名称快照' }
                                  status: { type: string, description: 'SERVING/QUEUING' }
                                  estimatedMinutes:
                                    type: integer
                                    description: '该单预计分钟：服务中为剩余分钟，排队中为总时长（含加时），向上取整'

  /api/v1/selfwash/orders:
    post:
      tags: [selfwash]
      summary: 选位下单（快照服务价/时长，建待支付订单）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workstationId, serviceId, plateNo, vehicleType]
              properties:
                workstationId: { type: integer, format: int64 }
                serviceId: { type: integer, format: int64 }
                couponUserId: { type: integer, format: int64, description: '选填，使用的优惠券；下单即核销并抵减实付' }
                plateNo: { type: string, description: '必填，车牌；用于工位排队展示与监控，缺号无法现场核身' }
                vehicleType:
                  type: string
                  enum: [SEDAN, SUV, MPV, OTHER]
                  description: '必填，车型；不同车型工位/水量有差异，运营需据此调度'
      responses:
        '200':
          description: 成功（data 为订单号）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
    get:
      tags: [selfwash]
      summary: 我的自助订单列表
      parameters:
        - name: tab
          in: query
          required: false
          description: WAIT_USE 待使用 / ONGOING 进行中 / DONE 已完成 / CANCELED 已取消
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SelfwashOrderVO' }

  /api/v1/selfwash/orders/{orderNo}:
    get:
      tags: [selfwash]
      summary: 自助订单详情（SERVING 时带剩余秒数）
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SelfwashOrderVO' }

  /api/v1/selfwash/orders/{orderNo}/pay-balance:
    post:
      tags: [selfwash]
      summary: 储值余额支付（扣余额 → 待使用）
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/selfwash/orders/{orderNo}/mock-pay:
    post:
      tags: [selfwash]
      summary: 模拟微信支付（仅本地开发，受 wash.pay.mock-enabled 控制）
      x-dev-only: true
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/selfwash/orders/{orderNo}/cancel:
    post:
      tags: [selfwash]
      summary: 取消订单（待支付直接取消；待使用且储值支付退余额；服务中不可取消）
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/selfwash/orders/{orderNo}/activate:
    post:
      tags: [selfwash]
      summary: 到店激活/开始服务（空闲则通电倒计时，有正在服务则排队）
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功（data 为激活后的订单，SERVING 或 QUEUING）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SelfwashOrderVO' }

  /api/v1/selfwash/orders/{orderNo}/add-time:
    post:
      tags: [selfwash]
      summary: 加时（按后台配置的「超时价/超时时长」整档计费，不足一档按一档；从储值余额扣除后延长服务倒计时；余额不足返回 B3004）
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 240 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SelfwashOrderVO' }

  /api/v1/selfwash/orders/{orderNo}/finish:
    post:
      tags: [selfwash]
      summary: 结束服务（断电完成，若有排队自动开始下一单）
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # ============================ 发票 ============================
  /api/v1/invoices:
    post:
      tags: [invoice]
      summary: 申请开票（按订单；金额由后端按订单实付解析，前端不传金额）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNo, title, email]
              properties:
                orderNo: { type: string, description: '无感或自助订单号' }
                titleType: { type: string, description: 'PERSONAL/COMPANY，企业需填税号' }
                title: { type: string, description: '发票抬头' }
                taxNo: { type: string }
                email: { type: string, description: '接收邮箱' }
                remark: { type: string }
      responses:
        '200':
          description: 成功（data 为申请ID）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
    get:
      tags: [invoice]
      summary: 我的发票申请列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/InvoiceVO' }

  /api/v1/invoices/{invoiceId}:
    get:
      tags: [invoice]
      summary: 发票申请详情
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InvoiceVO' }

  # ============================ 邀请好友 ============================
  /api/v1/invite/code:
    get:
      tags: [invite]
      summary: 我的邀请码（首次调用生成并落库）
      responses:
        '200':
          description: 成功（data 为邀请码，如 CGAB12XY）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { type: string }

  /api/v1/invite/bind:
    post:
      tags: [invite]
      summary: 绑定邀请码（被邀请人调用）
      description: |
        校验邀请码有效、不能邀请自己、同一被邀请人只能绑定一次。
        绑定成功后给被邀请人发「新人券」作首单优惠（已领过则忽略）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/invite/list:
    get:
      tags: [invite]
      summary: 我邀请的人 + 统计
      description: |
        被邀请人首次成单（支付成功）后，系统给邀请人发一张 INVITE 奖励券（如 10 元），
        此时该邀请记录状态变为 REWARDED。发奖由订单支付成功处触发，不由此接口触发。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invitedCount: { type: integer }
                          rewardedCount: { type: integer }
                          list:
                            type: array
                            items:
                              type: object
                              properties:
                                inviteId: { type: integer, format: int64 }
                                inviteeMemberId: { type: integer, format: int64 }
                                status: { type: string, description: 'BOUND/REWARDED' }
                                statusLabel: { type: string }
                                firstOrderNo: { type: string }
                                createTime: { type: string, format: date-time }

  # ============================ 消息通知 ============================
  /api/v1/notify/templates:
    get:
      tags: [notify]
      summary: 通知模板列表（枚举名 → 中文名）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: { type: string }

  /api/v1/notify/test:
    post:
      tags: [notify]
      summary: 开发自测推送（x-dev-only；真实推送由业务服务端触发）
      description: |
        骨架期走 mock 通道只打点；模板ID配置在 wash.notify.templates.*，
        未配置且关闭 mock 时会跳过并记录原因（不静默丢消息）。
      x-dev-only: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                template: { type: string, description: 'NotifyTemplate 枚举名，默认 ORDER_STATUS' }
      responses:
        '200':
          description: 成功（data 为是否发送）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { type: boolean }

  # ============================ 订单 ============================
  /api/v1/orders:
    post:
      tags: [order]
      summary: 提交订单
      description: |
        后端按顺序校验：格口可用 → 产能未超 → 车辆/地址/机柜/协议齐全。
        成功后生成 WAIT_PAY 订单并预占格口（TTL 15 分钟，与支付倒计时一致）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateOrderVO'
    get:
      tags: [order]
      summary: 我的订单列表（三 Tab）
      parameters:
        - name: tab
          in: query
          schema:
            type: string
            enum: [PENDING, SERVING, DONE]
            description: |
              待处理 PENDING：客户还差一步动作（待支付 / 待存钥匙）；
              服务中 SERVING：钥匙已入柜起，取车→运输→清洗→质检→还车→待客户取回钥匙；
              已完成 DONE：待评价 / 已完成 / 已取消 / 退款中 / 已退款。
              分组映射由后端唯一定义（WashOrderQueryService），前端不得自行推断状态集合。
            default: PENDING
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/OrderListItemVO'
                          total: { type: integer, format: int64 }
                          pageNum: { type: integer }
                          pageSize: { type: integer }

  /api/v1/orders/{orderNo}:
    get:
      tags: [order]
      summary: 订单详情（含 8 节点时间轴与证据）
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetailVO'

  /api/v1/orders/{orderNo}/cancel:
    post:
      tags: [order]
      summary: 取消订单
      description: |
        走状态机 CANCEL 事件。客户自助仅限 WAIT_PAY / WAIT_KEY / KEY_IN / PICKING，
        其余状态返回 B1002。取消后释放格口、回补产能、返还权益并自动触发退款。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/orders/{orderNo}/take-key-back:
    post:
      tags: [order]
      summary: 客户确认已取回钥匙（TAKE_KEY_BACK）
      description: |
        取钥匙是物理动作，正式环境应由柜机回调驱动；MVP 无真柜机，由客户在取钥匙
        开箱码页点击确认。后端释放格口 + 状态机 RETURNED → WAIT_REVIEW。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/orders/{orderNo}/open-code:
    post:
      tags: [order]
      summary: 获取开箱码（存/取钥匙）
      description: |
        仅「待存钥匙 WAIT_KEY」与「已送回 RETURNED」两个环节可调用，后端按订单状态自行判定存/取，
        前端无需传 action。开箱码 10 分钟内有效，仅可使用一次（取码即写入开箱留痕，明文不留库）。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OpenCodeVO'

  /api/v1/orders/{orderNo}/emergency-take-key:
    post:
      tags: [order]
      summary: 紧急取钥匙
      description: |
        未取车 → 立即告警 + 取消 + 全额退款；
        已在清洗 → 返回预计完成时间并拒绝取回（错误码 B1002）。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # ============================ 支付 ============================
  /api/v1/payments/{orderNo}/prepay:
    post:
      tags: [pay]
      summary: 获取微信支付参数
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          timeStamp: { type: string }
                          nonceStr: { type: string }
                          package: { type: string }
                          signType: { type: string }
                          paySign: { type: string }
                          expireAt:
                            type: integer
                            format: int64
                            description: 支付截止时间（毫秒时间戳），前端倒计时以此为准

  /device-callback/v1/slot/deposit:
    post:
      tags: [device]
      summary: 柜机回调：钥匙已存入
      description: |
        客户凭开箱码打开格口并放入钥匙后，柜机回调本接口，触发状态机 DEPOSIT_KEY（WAIT_KEY → KEY_IN）。
        生产环境必须校验柜机签名 + IP 白名单（当前实现仅校验开箱码，接入硬件时补签名校验）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNo, code]
              properties:
                orderNo: { type: string }
                code: { type: string, description: 6 位开箱码 }
                slotNo: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/payments/wechat/notify:
    post:
      tags: [pay]
      summary: 微信支付结果回调
      description: |
        由微信支付服务器调用，无需登录态。必须：① 验签 ② 幂等（同一通知多次到达只处理一次）
        ③ 成功后调状态机 PAY_SUCCESS。
        本地开发（provider=mock）可直接 POST 该接口模拟回调。
      security: []
      responses:
        '200':
          description: 成功（返回给微信的应答）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }

  # ============================ 支付（开发用） ============================
  /api/v1/payments/{orderNo}/mock-pay:
    post:
      tags: [pay]
      summary: 模拟支付成功（仅本地开发）
      description: |
        开发期替代微信支付回调，触发状态机 PAY_SUCCESS 事件（WAIT_PAY → WAIT_KEY）。
        由配置项 wash.pay.mock-enabled 控制，生产环境必须为 false，否则返回 A0003。
      x-dev-only: true
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PayResultVO'

  /api/v1/payments/{orderNo}/balance:
    post:
      tags: [pay]
      summary: 储值余额全额支付（本期渠道之一）
      description: |
        用钱包余额（充值本金 + 赠送，先赠后本）全额支付订单：扣款 → 状态机 PAY_SUCCESS（WAIT_PAY → WAIT_KEY）。
        与支付回调同一事务，扣款与状态推进同成功同回滚。余额不足返回 B3004，前端据此弹「充值更优惠」引导。
        微信支付仍走 prepay / mock-pay（本期不接真实微信）。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # ============================ 储值钱包 ============================
  /api/v1/wallet:
    get:
      tags: [wallet]
      summary: 我的钱包（余额）
      description: 无钱包行时惰性创建。金额单位为分。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          balance: { type: integer, format: int64, description: '充值本金余额（分）' }
                          giftBalance: { type: integer, format: int64, description: '赠送余额（分）' }
                          totalRecharge: { type: integer, format: int64, description: '累计充值本金（分）' }

  /api/v1/wallet/recharge-rules:
    get:
      tags: [wallet]
      summary: 充值赠送规则（供「充值更优惠」弹窗）
      description: 仅返回启用中的规则，按 sortOrder 升序。金额单位为分。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            ruleId: { type: integer, format: int64 }
                            rechargeFen: { type: integer, format: int64, description: '充值门槛（分）' }
                            giftFen: { type: integer, format: int64, description: '赠送（分）' }

  /api/v1/wallet/recharge:
    post:
      tags: [wallet]
      summary: 发起充值
      description: |
        ruleId（选赠送档）与 amountFen（自定义金额）二选一，ruleId 优先；自定义金额不赠送。
        生成 INIT 充值单；本地由 mock-pay 到账（微信渠道后补）。金额单位为分。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ruleId: { type: integer, format: int64 }
                amountFen: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rechargeNo: { type: string }
                          payAmount: { type: integer, format: int64 }
                          giftAmount: { type: integer, format: int64 }
                          expireAt: { type: integer, format: int64, description: '支付截止（毫秒）' }

  /api/v1/wallet/recharge/{rechargeNo}/mock-pay:
    post:
      tags: [wallet]
      summary: 模拟充值到账（仅本地开发）
      description: 受 wash.pay.mock-enabled 控制，生产必须 false。幂等：重复调用返回当前余额，不重复入账。
      x-dev-only: true
      parameters:
