        wash.cs.night-tip / wash.cs.wecom-qrcode-url）→ application.yml 兜底 → 代码默认。
        platformPhone 默认 10086：客服入口任何时候都必须能拨通（bug092203）。
        faqs（您可能会遇到的问题）由后台「客服配置」页维护，存于 wash_cs_faq 表；
        未配置时返回空数组，前端自行决定是否展示占位。
      responses:
