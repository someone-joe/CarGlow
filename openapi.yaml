      summary: 我的退款单列表
      description: |
        只返回本人的退款单。**钱是否真的退回去，以本表 status 为准**，订单状态 REFUNDING 只是"处理中"。
        status 来自渠道结果：INIT 待退款 / SUCCESS 已退 / FAILED 失败（系统在跑自动重试）。
      parameters:
        - name: orderNo
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
