          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          balance: { type: integer, format: int64 }
                          giftBalance: { type: integer, format: int64 }
                          totalRecharge: { type: integer, format: int64 }

