                    properties:
                      data:
                        type: object
                        properties:
                          wecomQrcodeUrl: { type: string }
                          platformPhone: { type: string }
                          stationPhone: { type: string }
                          nightTip: { type: string }
                          faqs:
                            type: array
                            description: 常见问题（您可能会遇到的问题），按 sortOrder 升序
                            items:
                              type: object
                              properties:
                                question: { type: string, description: 问题文案 }
                                answer: { type: string, description: 解答文案，可空；空则前端弹通用占位 }

