              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                tags:
                  type: array
                  items: { type: string }
                  description: 洗得干净 / 时效快 / 服务态度好 / 取送准时
                content: { type: string }
                images:
                  type: array
                  items: { type: string }
                  description: 已上传图片的 fileId
      responses:
