  # ========================= 首页 Banner（后台） =========================
  # ============================ 后台：售后处置 / 退款单 ============================
  /admin-api/wash/after-sale/list:
    get:
      tags: [admin-aftersale]
      summary: 售后工单分页
      x-permission: wash:aftersale:list
      parameters:
        - name: afterSaleNo
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [REWASH, REFUND, CLAIM] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [INIT, PROCESSING, DONE, REJECTED] }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/AdminAfterSaleVO' }

  /admin-api/wash/after-sale/{afterSaleNo}/handle:
    put:
      tags: [admin-aftersale]
      summary: 处置售后工单
      description: |
        同意退款（accept=true 且工单 type=REFUND）时才进入退款链路：服务端发退款事件 →
        支付域建退款单并调渠道。**本接口返回成功只表示已受理，不代表钱已到账**，
        钱是否退回以退款单 status 为准（退失败会留在 FAILED 由任务重试）。
        驳回必须带处置说明，师傅/客户要看到原因。处置人取当前后台登录账号，由服务端写入，前端不传。
      x-permission: wash:aftersale:handle
      parameters:
        - name: afterSaleNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean, description: 'true 同意 / false 驳回' }
                remark: { type: string, description: '驳回时必填；同意时也建议填写处理说明' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/refund/list:
    get:
      tags: [admin-refund]
      summary: 退款单分页
      x-permission: wash:refund:list
      parameters:
        - name: orderNo
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [INIT, SUCCESS, FAILED] }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/RefundVO' }

  /admin-api/wash/refund/{refundNo}/retry:
    post:
      tags: [admin-refund]
      summary: 人工重试退款
      description: |
        超过自动重试上限、或运营催办时用。仍走一次真实渠道调用，失败会累加 retryCount。
        SUCCESS 的单不允许重退（重退等于重复打款），会直接拒绝。
      x-permission: wash:refund:edit
      parameters:
        - name: refundNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  # ============================ 后台：优惠券管理 ============================
  /admin-api/wash/coupon/template/list:
    get:
      tags: [admin-coupon]
      summary: 优惠券模板分页
      description: |
        含已下架的模板（运营要能找回），不含已删除的。
        remain = total - issued（剩余可领），由后端算好下发，前端不要自己减。
        金额字段一律**分**，与后端存储一致；表单元→分换算在前端做。
      x-permission: wash:coupon:list
      parameters:
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [NORMAL, NEWBIE, INVITE] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [Y, N] }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/AdminCouponTemplateVO' }

  /admin-api/wash/coupon/template/{templateId}:
    get:
      tags: [admin-coupon]
      summary: 券模板详情
      x-permission: wash:coupon:list
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminCouponTemplateVO' }

    delete:
      tags: [admin-coupon]
      summary: 删除券模板（逻辑删除）
      description: 与其它表一致不做物理删除：已发出去的券还引用着模板名与金额快照。
      x-permission: wash:coupon:remove
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/coupon/template:
    post:
      tags: [admin-coupon]
      summary: 新增券模板
      x-permission: wash:coupon:add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, thresholdAmount, discountAmount, total, perLimit, startTime, endTime]
              properties:
                name: { type: string }
                type: { type: string, enum: [NORMAL, NEWBIE, INVITE] }
                thresholdAmount: { type: integer, format: int64, description: 使用门槛（分），0 = 无门槛 }
                discountAmount: { type: integer, format: int64, description: 减免金额（分） }
                total: { type: integer, description: 发行总量 }
                perLimit: { type: integer, description: 每人限领 }
                startTime: { type: integer, format: int64, description: 毫秒时间戳 }
                endTime: { type: integer, format: int64, description: 毫秒时间戳 }
                status: { type: string, enum: [Y, N], description: 不传默认 Y 上架 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

    put:
      tags: [admin-coupon]
      summary: 修改券模板
      description: |
        **不在这里改 total / issued**：模板一旦发行过，总量与已领量就成了历史账，
        改这两列会让"已领/剩余"和真实发出的券对不上。要加量请发新模板，别改老的。
        上下架走专门的 status 接口，与资料修改分开（避免改名字时顺手把券下架了）。
      x-permission: wash:coupon:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [couponTemplateId, name, type, thresholdAmount, discountAmount, perLimit, startTime, endTime]
              properties:
                couponTemplateId: { type: integer, format: int64 }
                name: { type: string }
                type: { type: string, enum: [NORMAL, NEWBIE, INVITE] }
                thresholdAmount: { type: integer, format: int64 }
                discountAmount: { type: integer, format: int64 }
                perLimit: { type: integer }
                startTime: { type: integer, format: int64 }
                endTime: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/coupon/template/{templateId}/status:
    post:
      tags: [admin-coupon]
      summary: 券模板上架 / 下架
      x-permission: wash:coupon:edit
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [Y, N] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/coupon/grant:
    post:
      tags: [admin-coupon]
      summary: 给指定会员发券
      description: |
        运营手工发放（补偿、线下活动）。与 C 端自助领取**共用同一套库存扣减**：
        乐观更新 `issued < total` 才 +1，发不完会明确报错，不会超发。
        每人限领同样生效（perLimit 对后台发放一样算数，否则等于绕过了规则）。
      x-permission: wash:coupon:grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId, memberId]
              properties:
                templateId: { type: integer, format: int64 }
                memberId: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/coupon/record/list:
    get:
      tags: [admin-coupon]
      summary: 领用 / 核销记录分页
      description: |
        按模板查"谁领了、谁用了、用在哪一单"。会员手机号一律脱敏返回（个保法最小化，
        与后台订单 / 会员列表同一口径），前端不要展示明文。
      x-permission: wash:coupon:list
      parameters:
        - name: templateId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: phone
          in: query
          required: false
          schema: { type: string, description: 按会员手机号模糊匹配（按明文匹配，返回结果仍脱敏） }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [UNUSED, USED, EXPIRED] }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/AdminCouponRecordVO' }

  /admin-api/wash/banner/list:
    get:
      tags: [admin-banner]
      summary: Banner 列表
      x-permission: wash:banner:list
      parameters:
        - name: title
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { type: object }

  /admin-api/wash/banner/{bannerId}:
    get:
      tags: [admin-banner]
      summary: Banner 详情
      x-permission: wash:banner:list
      parameters:
        - name: bannerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuoYiResult'
    delete:
      tags: [admin-banner]
      summary: 删除 Banner（逻辑删除）
      x-permission: wash:banner:remove
      parameters:
        - name: bannerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuoYiResult'

  /admin-api/wash/banner:
    post:
      tags: [admin-banner]
      summary: 新增 Banner
      x-permission: wash:banner:add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                subtitle: { type: string }
                imageUrl: { type: string, description: '为空则渲染文字图' }
                linkType:
                  type: string
                  enum: [NONE, ACTIVITY, RECHARGE, SERVICE]
                linkValue: { type: string, description: 'SERVICE 时传 serviceId' }
                sortOrder: { type: integer }
                startTime: { type: integer, format: int64, description: '生效时间(毫秒)，空=长期' }
                endTime: { type: integer, format: int64, description: '失效时间(毫秒)，空=长期' }
                enabled: { type: string, description: 'Y/N' }
      responses:
        '200':
          description: 成功（data 为新建 bannerId）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuoYiResult'
    put:
      tags: [admin-banner]
      summary: 修改 Banner
      x-permission: wash:banner:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bannerId, title]
              properties:
                bannerId: { type: integer, format: int64 }
                title: { type: string }
                subtitle: { type: string }
                imageUrl: { type: string }
                linkType: { type: string, enum: [NONE, ACTIVITY, RECHARGE, SERVICE] }
                linkValue: { type: string }
                sortOrder: { type: integer }
                startTime: { type: integer, format: int64 }
                endTime: { type: integer, format: int64 }
                enabled: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuoYiResult'

  # ========================= 师傅（工作人员）管理 =========================
  /admin-api/wash/worker/list:
    get:
      tags: [admin-worker]
      summary: 后台师傅列表
      description: |
        含已禁用与已离职（逻辑删除前）的记录，便于运营找回。
        **任何情况下都不返回 password**（即使是密文也不回）。
      x-permission: wash:worker:list
      parameters:
        - name: keyword
          in: query
          required: false
          description: 工号 / 姓名 / 手机号模糊匹配
          schema: { type: string }
        - name: siteId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          required: false
          description: 取值来自 GET /admin-api/wash/worker/status-options
          schema: { $ref: '#/components/schemas/WorkerStatus' }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/AdminWorkerVO' }

  /admin-api/wash/worker/status-options:
    get:
      tags: [admin-worker]
      summary: 师傅状态下拉选项
      description: 由 WorkerStatus 枚举生成，前端不得自带一份状态名单。
      x-permission: wash:worker:list
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StatusOption' }

  /admin-api/wash/worker/site-options:
    get:
      tags: [admin-worker]
      summary: 站点下拉选项（给师傅归属站点用）
      description: 来源 wash_site 表。将来站点/小区管理上线后，两者应共用同一个数据来源。
      x-permission: wash:worker:list
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CategoryOption' }

  /admin-api/wash/worker/{workerId}:
    get:
      tags: [admin-worker]
      summary: 师傅详情
      x-permission: wash:worker:list
      parameters:
        - name: workerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminWorkerVO' }
    delete:
      tags: [admin-worker]
      summary: 删除师傅（逻辑删除）
      description: |
        逻辑删除而非物理删行：历史任务的作业人仍指向该师傅记录。
        正在作业中的师傅不允许删除（有未完成任务时会被拒绝）。
      x-permission: wash:worker:remove
      parameters:
        - name: workerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/worker:
    post:
      tags: [admin-worker]
      summary: 新增师傅
      description: |
        工号唯一（重复返回 D4005）。初始密码必填 —— 由运营设置后线下告知师傅。
        密码 MVP 阶段明文存储，**上线前必须改 BCrypt（届时只动 WashWorkerService 的校验方法）**。
      x-permission: wash:worker:add
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminWorkerRequest' }
      responses:
        '200':
          description: 成功；data 为新增师傅 ID
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { type: integer, format: int64 }
    put:
      tags: [admin-worker]
      summary: 修改师傅资料
      description: |
        workerId 必填。修改时**不允许改密码** —— 改密码走独立的重置密码接口，避免误改把师傅锁在门外。
        把 status 改为 DISABLED 即禁用：该师傅无法登录，token 也会失效。
      x-permission: wash:worker:edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminWorkerRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/worker/{workerId}/reset-password:
    post:
      tags: [admin-worker]
      summary: 重置师傅密码
      description: 运营日常最高频的操作之一（师傅忘密码）。重置后该师傅的旧 token 立即失效。
      x-permission: wash:worker:reset
      parameters:
        - name: workerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminWorkerPasswordRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  # ---------------- 资质审核（T13） ----------------
  /admin-api/wash/worker/qualification/page:
    get:
      tags: [admin-worker]
      summary: 师傅资质审核分页
      description: 默认看 PENDING；可按 reviewStatus 筛选（PENDING / PASSED / REJECTED）。
      x-permission: wash:worker:audit
      parameters:
        - name: reviewStatus
          in: query
          required: false
          schema: { type: string, enum: [PENDING, PASSED, REJECTED] }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/WorkerQualificationAdminVO' }

  /admin-api/wash/worker/qualification/review:
    put:
      tags: [admin-worker]
      summary: 审核资质
      description: |
        审核结果只支持 PASSED / REJECTED；驳回必须带 reviewRemark（师傅要看到为什么没过）。
        通过后该师傅才满足派单准入（faceStatus + reviewStatus 均为 PASSED）。
      x-permission: wash:worker:audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId, reviewStatus]
              properties:
                workerId: { type: integer, format: int64 }
                reviewStatus: { type: string, enum: [PASSED, REJECTED] }
                reviewRemark: { type: string, description: 驳回原因（驳回时必填） }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/worker/qualification/face:
    put:
      tags: [admin-worker]
      summary: 登记人脸核身结果
      description: |
        人脸核身结果回填：PASSED / FAILED。faceProvider 区分 WECHAT（微信核身回调）与
        MANUAL（后台人工登记）。接入微信核身后同一字段回填 verifyId，数据模型不变。
      x-permission: wash:worker:audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId, faceStatus]
              properties:
                workerId: { type: integer, format: int64 }
                faceStatus: { type: string, enum: [PASSED, FAILED] }
                faceProvider: { type: string, enum: [WECHAT, MANUAL] }
                faceRef: { type: string, description: 核身凭证号（微信返回或人工登记） }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  # ---------------- 周排班（T13） ----------------
  /admin-api/wash/worker/{workerId}/schedule:
    get:
      tags: [admin-worker]
      summary: 师傅周排班
      x-permission: wash:worker:schedule
      parameters:
        - name: workerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WorkerScheduleVO' }
    put:
      tags: [admin-worker]
      summary: 整体覆盖周排班
      description: |
        一天可多段；段内时间必须合法（00:00-23:59，最长不超过 24 小时，允许跨天）。
        传空数组 = 清空（= 不限制派单时段）；「没配排班」与「配了但今天不在班」是两回事。
      x-permission: wash:worker:schedule
      parameters:
        - name: workerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [weekDay, startMinute, endMinute]
                properties:
                  weekDay: { type: integer, description: 星期 1-7（1=周一） }
                  startMinute: { type: integer, description: 开始（当日分钟数，如 540=09:00） }
                  endMinute: { type: integer, description: 结束（当日分钟数，如 1320=22:00） }
                  enabled: { type: string, enum: [Y, N], description: 是否启用 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/worker/{workerId}/tasks:
    get:
      tags: [admin-worker]
      summary: 师傅进行中的订单（后台改派选单用）
      x-permission: wash:order:dispatch
      parameters:
        - name: workerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminOrderBriefVO' }

  # ---------------- 派单（T13） ----------------
  /admin-api/wash/worker/dispatch/pool:
    get:
      tags: [admin-worker]
      summary: 后台手动派单：待派单池
      description: 本站点、尚未派单的进行中状态订单。运营可点选直接指派给当前师傅。
      x-permission: wash:order:dispatch
      parameters:
        - name: siteId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminOrderBriefVO' }

  /admin-api/wash/worker/dispatch/candidates:
    get:
      tags: [admin-worker]
      summary: 派单候选师傅
      description: 本站点、账号正常、已上班的师傅；按同小区优先 + 负载排序。资质/在班由前端展示，后端只给候选。
      x-permission: wash:order:dispatch
      parameters:
        - name: siteId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: communityId
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DispatchCandidateVO' }

  /admin-api/wash/worker/dispatch:
    post:
      tags: [admin-worker]
      summary: 手动派单 / 改派
      description: 无条件覆盖 worker_id（含已派给别人的单），用于纠正自动派单结果。跨站点会被拒绝。
      x-permission: wash:order:dispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNo, workerId]
              properties:
                orderNo: { type: string }
                workerId: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/site/list:
    get:
      tags: [admin-site]
      summary: 后台站点列表
      x-permission: wash:site:list
      parameters:
        - name: keyword
          in: query
          required: false
          description: 站点名称模糊匹配
          schema: { type: string }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/WashSite' }

  /admin-api/wash/site/options:
    get:
      tags: [admin-site]
      summary: 站点下拉选项
      description: 来源 wash_site 表（del_flag=0），供小区管理等页面复用。
      x-permission: wash:site:list
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CategoryOption' }

  /admin-api/wash/site/{siteId}:
    get:
      tags: [admin-site]
      summary: 站点详情
      x-permission: wash:site:list
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WashSite' }
    delete:
      tags: [admin-site]
      summary: 删除站点（逻辑删除）
      x-permission: wash:site:remove
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/site:
    post:
      tags: [admin-site]
      summary: 新增站点
      x-permission: wash:site:add
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WashSite' }
      responses:
        '200':
          description: 成功；data 为新增站点 ID
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { type: integer, format: int64 }
    put:
      tags: [admin-site]
      summary: 修改站点配置
      x-permission: wash:site:edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WashSite' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/community/list:
    get:
      tags: [admin-community]
      summary: 后台小区列表
      x-permission: wash:community:list
      parameters:
        - name: keyword
          in: query
          required: false
          description: 小区名称模糊匹配
          schema: { type: string }
        - name: siteId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/WashCommunity' }

  /admin-api/wash/community/{communityId}:
    get:
      tags: [admin-community]
      summary: 小区详情
      x-permission: wash:community:list
      parameters:
        - name: communityId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WashCommunity' }
    delete:
      tags: [admin-community]
      summary: 删除小区（逻辑删除）
      x-permission: wash:community:remove
      parameters:
        - name: communityId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/community:
    post:
      tags: [admin-community]
      summary: 新增小区
      x-permission: wash:community:add
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WashCommunity' }
      responses:
        '200':
          description: 成功；data 为新增小区 ID
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { type: integer, format: int64 }
    put:
      tags: [admin-community]
      summary: 修改小区 / 授权 / 启停
      x-permission: wash:community:edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WashCommunity' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 小程序侧 wx-token；后台侧若依 token
    deviceSign:
      type: apiKey
      in: header
      name: X-Signature
      description: 柜机回调签名，配合 X-Device-No、X-Timestamp 与 IP 白名单

  parameters:
    PageNum:
      name: pageNum
      in: query
      schema: { type: integer, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, default: 10 }
    SiteId:
      name: siteId
      in: query
      required: false
      schema: { type: integer, format: int64 }
    CommunityId:
      name: communityId
      in: query
      required: false
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键，客户端生成 UUID，同一键重复提交返回首次结果
      schema: { type: string }

  schemas:

    CouponTemplateVO:
      type: object
      properties:
        templateId: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string, enum: [NORMAL, NEWBIE] }
        thresholdAmount: { type: integer, format: int64, description: 使用门槛（分） }
        discountAmount: { type: integer, format: int64, description: 减免金额（分） }
        perLimit: { type: integer }
        endTime: { type: integer, format: int64, description: 失效时间（毫秒） }
        remain: { type: integer, description: 剩余库存 }
        claimed: { type: integer, description: 当前会员已领数量 }

    CouponUserVO:
      type: object
      properties:
        couponUserId: { type: integer, format: int64 }
        templateId: { type: integer, format: int64 }
        name: { type: string }
        thresholdAmount: { type: integer, format: int64 }
        discountAmount: { type: integer, format: int64 }
        status: { type: string, enum: [UNUSED, USED, EXPIRED] }
        expireTime: { type: integer, format: int64 }
        orderNo: { type: string }

    CouponBestVO:
      type: object
      properties:
        couponUserId: { type: integer, format: int64 }
        discountAmount: { type: integer, format: int64 }

    InsuranceProductVO:
      type: object
      properties:
        productId: { type: integer, format: int64 }
        name: { type: string }
        priceAmount: { type: integer, format: int64, description: 保费（分） }
        coverageDesc: { type: string }

    InsurancePolicyVO:
      type: object
      properties:
        policyId: { type: integer, format: int64 }
        policyNo: { type: string }
        productId: { type: integer, format: int64 }
        name: { type: string }
        vehicleId: { type: integer, format: int64 }
        orderNo: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, CANCELED] }
        startTime: { type: integer, format: int64 }
        endTime: { type: integer, format: int64 }
        paidAmount: { type: integer, format: int64, description: 实付保费（分） }

    Result:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: |
            0 = 成功，非 0 见 x-error-codes。
            数字映射规则：分段字母转前缀（A=1 / B=2 / C=3）+ 4 位编号，
            即 A0002 → 10002、B1002 → 21002、C0001 → 30001。
          example: 0
        msg:
          type: string
          example: 操作成功
        data:
          description: 业务数据，各接口不同
        traceId:
          type: string
          description: 链路追踪 ID，排查问题时提供

    # ---------------- 订单状态（与 OrderStatus.java 必须逐条一致） ----------------
    OrderStatus:
      type: string
      description: |
        订单状态，取值必须与《订单状态机规则表.md》及 OrderStatus 枚举完全一致（15 个）。
      enum:
        - WAIT_PAY        # 待支付
        - WAIT_KEY        # 待存钥匙
        - KEY_IN          # 钥匙已入柜
        - PICKING         # 取车中
        - TO_STATION      # 运输中（去程）
        - WASHING         # 清洗中
        - QC              # 待质检
        - WAIT_RETURN     # 待还车
        - RETURNING       # 运输中（回程）
        - RETURNED        # 已还车（待取钥匙）
        - WAIT_REVIEW     # 待评价
        - FINISHED        # 已完成（终态）
        - CANCELED        # 已取消
        - REFUNDING       # 退款中
        - REFUNDED        # 已退款（终态）

    # ---------------- C 端时间轴 8 节点 ----------------
    TimelineNode:
      type: object
      properties:
        node:
          type: string
          enum: [ORDERED, KEY_IN, PICKED, ARRIVED, WASHING, QC_DONE, RETURNED, WAIT_TAKE_KEY]
          description: 已下单 / 钥匙已入柜 / 已取车 / 到达中央站 / 清洗中 / 质检完成 / 已还车 / 待取钥匙
        title: { type: string }
        time:
          type: integer
          format: int64
          description: 毫秒时间戳，未到达时为空
        reached: { type: boolean }
        current: { type: boolean }
        evidences:
          type: array
          description: 该节点的照片等证据
          items:
            $ref: '#/components/schemas/MediaVO'

    # ---------------- 师傅端（工作人员） ----------------
    WorkerProfileVO:
      type: object
      description: 师傅档案 + 状态聚合（打卡 / 资质 / 在班 / 进行中单量）
      properties:
        workerId: { type: integer, format: int64 }
        workerNo: { type: string }
        name: { type: string }
        phone: { type: string }
        siteId: { type: integer, format: int64 }
        communityId: { type: integer, format: int64, description: 服务小区ID（派单优先同小区） }
        workStatus: { type: string, enum: [OFFLINE, ONLINE, BUSY] }
        qualificationPassed: { type: boolean, description: 资质是否全过（人脸核身 + 审核），派单准入 }
        onDutyToday: { type: boolean, description: 今天是否按排班在班（没配排班=true） }
        activeOrderCount: { type: integer, description: 进行中订单数（负载） }

    WorkerQualificationVO:
      type: object
      description: 师傅资质视图（身份证脱敏；人脸 / 审核状态驱动接单资格）
      properties:
        submitted: { type: boolean, description: 是否已提交过资质 }
        idName: { type: string }
        idNo: { type: string, description: 身份证号（脱敏：中间 ****） }
        idFrontFile: { type: string, description: 身份证正面照 fileId }
        idBackFile: { type: string, description: 身份证反面照 fileId }
        licenseFile: { type: string, description: 驾照照 fileId }
        faceStatus: { type: string, enum: [PENDING, PASSED, FAILED] }
        faceProvider: { type: string, enum: [WECHAT, MANUAL] }
        faceRef: { type: string, description: 核身凭证号 }
        faceTime: { type: integer, format: int64 }
        reviewStatus: { type: string, enum: [PENDING, PASSED, REJECTED] }
        reviewRemark: { type: string, description: 驳回原因 }
        submitTime: { type: integer, format: int64 }
        reviewTime: { type: integer, format: int64 }

    WorkerQualificationAdminVO:
      type: object
      description: 后台资质审核行（运营需核验证件，idNo 不脱敏）
      properties:
        id: { type: integer, format: int64 }
        workerId: { type: integer, format: int64 }
        idName: { type: string }
        idNo: { type: string }
        idFrontFile: { type: string }
        idBackFile: { type: string }
        licenseFile: { type: string }
        faceStatus: { type: string, enum: [PENDING, PASSED, FAILED] }
        faceProvider: { type: string, enum: [WECHAT, MANUAL] }
        faceRef: { type: string }
        faceTime: { type: integer, format: int64 }
        reviewStatus: { type: string, enum: [PENDING, PASSED, REJECTED] }
        reviewRemark: { type: string }
        submitTime: { type: integer, format: int64 }
        reviewTime: { type: integer, format: int64 }

    WorkerScheduleVO:
      type: object
      description: 师傅周排班单项
      properties:
        id: { type: integer, format: int64 }
        workerId: { type: integer, format: int64 }
        weekDay: { type: integer, description: 星期 1-7（1=周一） }
        startMinute: { type: integer, description: 开始（当日分钟数，如 540=09:00） }
        endMinute: { type: integer, description: 结束（当日分钟数，如 1320=22:00） }
        enabled: { type: string, enum: [Y, N] }

    DispatchCandidateVO:
      type: object
      description: 派单候选师傅（同小区优先 + 负载展示）
      properties:
        value: { type: integer, format: int64, description: workerId }
        label: { type: string, description: 姓名（工号） }
        communityId: { type: integer, format: int64, description: 服务小区ID }
        activeCount: { type: integer, description: 进行中订单数 }

    AdminOrderBriefVO:
      type: object
      description: 后台订单简表（派单 / 改派选单用）
      properties:
        orderNo: { type: string }
        status: { type: string }
        statusLabel: { type: string, description: 状态中文名，由后端枚举给出 }
        serviceName: { type: string }
        vehiclePlate: { type: string }
        communityId: { type: integer, format: int64 }
        assignedAt: { type: integer, format: int64, description: 派单时间（毫秒） }

    WorkerLoginVO:
      type: object
      properties:
        token: { type: string }
        expireAt: { type: integer, format: int64 }
        workerId: { type: integer, format: int64 }
        workerNo: { type: string, description: 工号 }
        name: { type: string }
        siteId: { type: integer, format: int64 }
        siteName: { type: string }
        status: { type: string, enum: [NORMAL, DISABLED], description: 正常 / 禁用 }

    # ---------------- 登录 ----------------
    LoginVO:
      type: object
      properties:
        token: { type: string }
        expireAt: { type: integer, format: int64 }
        isNewUser: { type: boolean }
        needAgreement: { type: boolean, description: true 时前端弹《用户服务协议》《隐私政策》 }
        phoneBound: { type: boolean }

    # ---------------- 站点 / 小区 ----------------
    SiteVO:
      type: object
      properties:
        siteId: { type: integer, format: int64 }
        siteName: { type: string }
        communityId: { type: integer, format: int64 }
        communityName: { type: string }
        displayName:
          type: string
          description: 站点栏展示文案，如「泷景花园 · 泷景中央站」
        serviceStatus:
          type: string
          enum: [OPEN, CLOSED, RAINY]
          description: 正常 / 停业 / 雨天模式
        closedNotice: { type: string }

    CommunityVO:
      type: object
      properties:
        communityId: { type: integer, format: int64 }
        name: { type: string }
        accessAuth:
          type: boolean
          description: 地库通行授权，false 时禁止该小区下单
        enabled: { type: boolean }

    BannerVO:
      type: object
      properties:
        bannerId: { type: integer, format: int64 }
        imageUrl:
          type: string
          description: 图片URL；为空时 C 端渲染「标题+副标题」文字图
        title: { type: string }
        subtitle: { type: string, description: 副标题（无图时文字图展示） }
        linkType:
          type: string
          enum: [NONE, ACTIVITY, RECHARGE, SERVICE]
        linkValue:
          type: string
          description: 跳转值；SERVICE 时传 serviceId，前端据此进服务详情
        sort: { type: integer }

    CapacityVO:
      type: object
      properties:
        date: { type: string, format: date }
        total: { type: integer }
        used: { type: integer }
        remaining: { type: integer }
        depositDeadline:
          type: string
          description: 最晚存钥匙时间，如 23:00
        promiseReturnTime:
          type: string
          description: 承诺还车时间，如 次日 07:00
        businessStart:
          type: string
          description: 营业开始时间（整点，如 19:00）；站点可配置，下单页据此生成可选时段
        businessEnd:
          type: string
          description: 营业结束时间（整点，如 23:00）
        soldOut: { type: boolean }

    # ---------------- 商品 ----------------
    ServiceCategoryVO:
      type: object
      properties:
        categoryId: { type: integer, format: int64 }
        name:
          type: string
          example: 洗车服务
        sort: { type: integer }

    ServiceVO:
      type: object
      properties:
        serviceId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        scene:
          type: string
          description: 入口场景，UNSENSITIVE 无感 / SELFWASH 自助 / ALL 两入口通用
          enum: [UNSENSITIVE, SELFWASH, ALL]
        name: { type: string }
        subtitle: { type: string }
        originPrice: { type: integer, description: 原价，单位分 }
        salePrice: { type: integer, description: 活动价，单位分 }
        memberPrice:
          type: integer
          description: 会员价，单位分；非会员为空
        displayPrice:
          type: integer
          description: 实际展示价，优先级 会员价 > 活动价 > 原价，由后端算好
        workMinutes: { type: integer }
        pickupFee:
          type: integer
          description: 取送车费，固定展示 0（卖点）
        dailyLimit: { type: integer }
        soldOut: { type: boolean, description: 今日已约满 }
        coverUrl: { type: string }

    ServiceDetailVO:
      allOf:
        - $ref: '#/components/schemas/ServiceVO'
        - type: object
          properties:
            items:
              type: array
              description: 服务内容清单
              items: { type: string }
            applicableModels: { type: string, description: 适用车型 }
            notIncluded:
              type: array
              description: 不包含项
              items: { type: string }
            notices:
              type: array
              description: 注意事项
              items: { type: string }
            sampleImages:
              type: array
              description: 样图（图片URL）
              items: { type: string }
            cover: { type: string, description: 封面图URL }

    # ---------------- 钥匙柜 ----------------
    CabinetVO:
      type: object
      properties:
        cabinetId: { type: integer, format: int64 }
        name:
          type: string
          description: 命名规范 小区名+楼栋+单元+楼层，如「泷景花园 三号楼二单元负一」
        slotTotal: { type: integer }
        slotFree: { type: integer }
        online: { type: boolean }
        distance:
          type: integer
          description: 距您约多少米；未授权定位时为空
        full: { type: boolean }

    # ---------------- 车辆 ----------------
    VehicleVO:
      type: object
      properties:
        vehicleId: { type: integer, format: int64 }
        plateNo: { type: string }
        brand: { type: string }
        color: { type: string }
        vehicleType:
          type: string
          enum: [SEDAN, SUV, MPV, OTHER]
          description: '车型；与自助洗车下单共用同一 VehicleType 枚举'
        vehicleTypeLabel:
          type: string
          description: '车型中文名，后端枚举给出，前端只展示不翻译'
        photoUrl: { type: string }
        isNewEnergy: { type: boolean }
        isDefault: { type: boolean }
        address:
          $ref: '#/components/schemas/AddressVO'

    AddressVO:
      type: object
      properties:
        communityId: { type: integer, format: int64 }
        building: { type: string }
        unit: { type: string }
        floor:
          type: string
          example: 负一层
        parkingNo:
          type: string
          example: A 区 23 号车位

    VehicleRequest:
      type: object
      required: [plateNo]
      properties:
        plateNo: { type: string, description: 支持新能源 8 位 }
        brand: { type: string }
        color: { type: string }
        vehicleType:
          type: string
          enum: [SEDAN, SUV, MPV, OTHER]
          description: '车型；选填，自助洗车下单需据此调度'
        photoFileId: { type: string }
        isNewEnergy: { type: boolean }
        isDefault: { type: boolean }
        address:
          $ref: '#/components/schemas/AddressVO'

    # ---------------- 订单 ----------------
    CreateOrderRequest:
      type: object
      required: [serviceId, vehicleId, cabinetId, appointDate, appointTime, agreed]
      properties:
        serviceId: { type: integer, format: int64 }
        vehicleId: { type: integer, format: int64 }
        cabinetId: { type: integer, format: int64 }
        appointDate: { type: string, format: date }
        appointTime:
          type: string
          example: '19:00'
        pickupRequired:
          type: boolean
          default: true
          description: 是否需要取送车，V1.0 固定 true
        remark: { type: string, maxLength: 100 }
        parkPhotoFileIds:
          type: array
          maxItems: 6
          items: { type: string }
          description: |
            停放照片，最多 6 张（bug092204）；先经 media/upload 上传后引用 fileId。
            下单时订单号尚未生成，故按「本人 + bizType=PARK + 尚未绑定订单」校验，
            下单成功时服务端把这些 fileId 的 orderNo 回填为本单。不通过返回 B1005。
        agreed:
          type: boolean
          description: 已同意《服务条款与钥匙寄存协议》
        couponUserId:
          type: integer
          format: int64
          description: 使用的优惠券 ID（来自「我的优惠券」UNUSED 券），不传则不使用优惠券


    CreateOrderVO:
      type: object
      properties:
        orderNo:
          type: string
          example: SE202609151601276839838676768265
        status:
          $ref: '#/components/schemas/OrderStatus'
        payAmount: { type: integer, description: 应付金额，单位分（已扣除优惠券抵扣） }
        couponDiscount:
          type: integer
          format: int64
          description: 优惠券抵扣金额，单位分；未用券时为 0
        payExpireAt:
          type: integer
          format: int64
          description: 支付截止时间，毫秒时间戳

    OrderListItemVO:
      type: object
      properties:
        orderNo: { type: string }
        status:
          $ref: '#/components/schemas/OrderStatus'
        statusLabel: { type: string }
        serviceName: { type: string }
        workMinutes: { type: integer }
        appointTime: { type: integer, format: int64 }
        communityName: { type: string }
        plateNo: { type: string }
        payAmount: { type: integer }
        createTime: { type: integer, format: int64, description: '下单时间（毫秒）。两类订单（无感 / 自助）融合列表时按它排序，故必须下发' }
        workerId: { type: integer, format: int64, description: 接单师傅ID；未派单为 null }
        workerName: { type: string, description: 派单师傅姓名快照（钥匙入柜后客户要知道谁接的单）；未派单为 null }
        assignedAt: { type: integer, format: int64, description: 派单时间（毫秒）；未派单为 null }
        mainAction:
          $ref: '#/components/schemas/OrderAction'
        subActions:
          type: array
          items:
            $ref: '#/components/schemas/OrderAction'

    OrderDetailVO:
      type: object
      properties:
        orderNo: { type: string }
        status:
          $ref: '#/components/schemas/OrderStatus'
        statusLabel: { type: string }
        statusDesc:
          type: string
          example: 清洗中 · 预计次日 6:30 送回原位
        promiseReturnTime: { type: integer, format: int64 }
        overdue: { type: boolean }
        siteName: { type: string }
        cabinetName: { type: string }
        slotNo: { type: string, description: 仅本人可见 }
        plateNo: { type: string }
        address:
          $ref: '#/components/schemas/AddressVO'
        serviceName: { type: string }
        remark: { type: string }
        originAmount: { type: integer }
        discountAmount: { type: integer }
        payAmount: { type: integer }
        payType: { type: string }
        workerId: { type: integer, format: int64, description: 接单师傅ID；未派单为 null }
        workerName: { type: string, description: 派单师傅姓名快照；未派单为 null }
        assignedAt: { type: integer, format: int64, description: 派单时间（毫秒）；未派单为 null }
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineNode'
        medias:
          type: array
          items:
            $ref: '#/components/schemas/MediaVO'
        mainAction:
          $ref: '#/components/schemas/OrderAction'
        subActions:
          type: array
          items:
            $ref: '#/components/schemas/OrderAction'

    PayResultVO:
      type: object
      description: 模拟支付返回（x-dev-only）
      properties:
        orderNo: { type: string }
        status:
          $ref: '#/components/schemas/OrderStatus'

    SelfwashOrderVO:
      type: object
      description: 自助洗车订单（C 端）。金额单位：分；时间为 ms。
      properties:
        orderNo: { type: string }
        siteId: { type: integer, format: int64 }
        workstationId: { type: integer, format: int64 }
        serviceName: { type: string }
        plateNo: { type: string }
        vehicleType: { type: string, enum: [SEDAN, SUV, MPV, OTHER] }
        vehicleTypeLabel: { type: string, description: '车型中文名，后端枚举给出，前端只展示不翻译' }
        serviceMinutes: { type: integer, description: '付费时长（分钟）' }
        payAmount: { type: integer, format: int64 }
        payChannel: { type: string, description: 'BALANCE/WECHAT_MOCK' }
        status:
          type: string
          enum: [WAIT_PAY, WAIT_USE, QUEUING, SERVING, PAUSED, DONE, CANCELED]
        statusLabel: { type: string }
        queueNo: { type: integer }
        startedAt: { type: integer, format: int64 }
        expireAt: { type: integer, format: int64 }
        addedSeconds: { type: integer }
        payExpireAt: { type: integer, format: int64 }
        cancelReason: { type: string }
        couponUserId: { type: integer, format: int64 }
        couponDiscount: { type: integer, format: int64, description: '优惠券抵扣金额（分）' }
        createTime: { type: string, format: date-time }
        remainingSeconds: { type: integer, format: int64, description: '服务剩余秒（SERVING 时）' }

    InvoiceVO:
      type: object
      description: 发票申请。金额单位：分。
      properties:
        invoiceId: { type: integer, format: int64 }
        memberId: { type: integer, format: int64 }
        orderNo: { type: string }
        amount: { type: integer, format: int64 }
        titleType: { type: string, description: 'PERSONAL/COMPANY' }
        title: { type: string }
        taxNo: { type: string }
        email: { type: string }
        status:
          type: string
          enum: [APPLYING, ISSUED, REJECTED]
        statusLabel: { type: string }
        invoiceNo: { type: string }
        rejectReason: { type: string }
        remark: { type: string }
        createTime: { type: string, format: date-time }

    OrderAction:
      type: object
      description: 按钮随状态机变化，前端不得自行推断，一律用后端返回值
      properties:
        action:
          type: string
          enum: [PAY, DEPOSIT_KEY, VIEW_PROGRESS, TAKE_KEY, REVIEW, REORDER, CANCEL, CONTACT_SERVICE]
        label: { type: string }
        enabled: { type: boolean }

    OpenCodeVO:
      type: object
      properties:
        code:
          type: string
          description: 6 位取件码
        qrcodeUrl: { type: string }
        cabinetName: { type: string }
        slotNo: { type: string }
        expireAt: { type: integer, format: int64 }

    MediaVO:
      type: object
      properties:
        fileId: { type: string }
        bizType:
          type: string
          enum: [PARK, PICK, WASHED, RETURN, COMPARE, VIDEO]
        url:
          type: string
          description: 临时访问地址，带有效期
        uploadTime: { type: integer, format: int64 }

    # ---------------- 师傅端 VO ----------------
    PickTaskVO:
      type: object
      description: 任务池单项（取送端）
      properties:
        orderNo: { type: string }
        bizType: { type: string, enum: [PICKUP, RETURN], description: 待取车 / 待送回 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusLabel:
          type: string
          description: 状态中文名，由后端 OrderStatus 枚举给出；前端禁止自行翻译状态码
        parkPhotos:
          type: array
          description: 用户上传的停车照（bizType=PARK），师傅找车用；无照片时为空数组
          items: { $ref: '#/components/schemas/MediaVO' }
        serviceName: { type: string }
        vehiclePlate: { type: string, description: 车牌 }
        vehicleBrand: { type: string }
        vehicleColor: { type: string }
        communityId:
          type: integer
          format: int64
          description: 小区ID。同小区任务在小程序端合并为一张卡片（T13 同小区合并）
        communityName: { type: string }
        assignedAt: { type: integer, format: int64, description: 派单时间（毫秒） }
        customerName: { type: string, description: 客户称呼，脱敏 }
        customerPhone: { type: string, description: 联系电话，脱敏 }
        pickupAddr: { type: string }
        returnAddr: { type: string }
        appointmentDate: { type: string, format: date, description: 预约服务日 }
        promiseReturnTime: { type: string, description: 承诺还车时间，如 次日 07:00 }
        pickupDeadline: { type: string, description: 最晚存钥匙时间 }
        requiredPhotoCount: { type: integer, description: 取车需拍照片数（≥6） }
        distanceMeters: { type: integer, description: 距师傅当前位置约多少米；未定位时为空 }

    StationQueueVO:
      type: object
      description: 中央站工位队列看板项
      properties:
        stationId: { type: integer, format: int64 }
        stationName: { type: string }
        washingCount: { type: integer, description: 清洗中数量 }
        qcCount: { type: integer, description: 待质检数量 }
        bays:
          type: array
          description: 工位列表
          items:
            type: object
            properties:
              bayNo: { type: string, description: 工位号 }
              orderNo: { type: string }
              status: { $ref: '#/components/schemas/OrderStatus' }
              startedAt: { type: integer, format: int64, description: 进入该工位时间（毫秒） }
              sopStep: { type: integer, description: 当前 15 步 SOP 进度，WASHING 时有效 }
        waiting:
          type: array
          description: |
            非「在洗」的订单，含待入场（TO_STATION）/ 待质检（QC）/ 待还车（WAIT_RETURN）。
            status 必带：前端据此决定给出「入场 / 质检 / 驶离」哪个动作。
          items:
            type: object
            properties:
              orderNo: { type: string }
              serviceName: { type: string }
              status: { $ref: '#/components/schemas/OrderStatus' }
              queuedAt: { type: integer, format: int64 }

    FaqVO:
      type: object
      properties:
        faqId: { type: integer, format: int64 }
        label:
          type: string
          example: 无法打开柜门
        answer: { type: string }
        ticketType:
          type: string
          description: 绑定的工单类型，一键建单时带入

    # ==========================================================================
    # 运营后台独有结构
    #
    # 后台复用若依原生返回结构（不套 Result），成功码是 200 不是 0：
    # RuoYi 的 request 拦截器按 code === 200 判定成功，改成 0 会让全后台报错。
    # ==========================================================================
    RuoYiResult:
      type: object
      required: [code, msg]
      description: 若依 AjaxResult。业务失败也是 HTTP 200，靠 code 区分。
      properties:
        code:
          type: integer
          description: 200 表示成功，非 200 为失败
          example: 200
        msg: { type: string, example: 操作成功 }
        data:
          description: 业务数据，各接口不同

    RuoYiTableDataInfo:
      type: object
      required: [code, total, rows]
      description: 若依分页结构。注意是平铺的 rows/total，不是 data.list。
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string }
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { type: object }
          description: 具体元素类型在各接口的 allOf 中覆盖

    # ---------------- 后台优惠券 ----------------
    AdminCouponTemplateVO:
      type: object
      description: |
        后台券模板行。金额一律分，时间一律毫秒时间戳。
        remain（剩余可领）由后端算好下发，前端不要自己减——避免前后端两套口径。
      properties:
        couponTemplateId: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string, enum: [NORMAL, NEWBIE, INVITE] }
        thresholdAmount: { type: integer, format: int64, description: 使用门槛（分），0 = 无门槛 }
        discountAmount: { type: integer, format: int64, description: 减免金额（分） }
        total: { type: integer, description: 发行总量 }
        issued: { type: integer, description: 已领取 }
        remain: { type: integer, description: 剩余可领 = total - issued }
        perLimit: { type: integer, description: 每人限领 }
        startTime: { type: integer, format: int64 }
        endTime: { type: integer, format: int64 }
        status: { type: string, enum: [Y, N] }
        createTime: { type: integer, format: int64 }

    AdminCouponRecordVO:
      type: object
      description: |
        领用 / 核销记录行。会员手机号**一律脱敏**（个保法最小化，与后台订单/会员列表同一口径），
        前端不得展示明文。金额一律分，时间毫秒时间戳。
      properties:
        couponUserId: { type: integer, format: int64 }
        couponTemplateId: { type: integer, format: int64 }
        templateName: { type: string }
        memberId: { type: integer, format: int64 }
        memberPhone: { type: string, description: 脱敏手机号，如 138****1234 }
        status: { type: string, enum: [UNUSED, USED, EXPIRED] }
        orderNo: { type: string, description: 核销所在订单号，未使用为 null }
        obtainTime: { type: integer, format: int64, description: 领取时间 }
        usedTime: { type: integer, format: int64, description: 核销时间，未使用为 null }
        expireTime: { type: integer, format: int64 }

    # ---------------- 售后 / 退款 ----------------
    AfterSaleVO:
      type: object
      description: 售后工单。金额一律单位分，时间一律毫秒时间戳。
      properties:
        afterSaleNo: { type: string }
        orderNo: { type: string }
        type: { type: string, enum: [REWASH, REFUND, CLAIM] }
        reason: { type: string }
        status: { type: string, enum: [INIT, PROCESSING, DONE, REJECTED] }
        statusLabel: { type: string, description: 状态中文名，由后端枚举给出，前端只展示不翻译 }
        amount: { type: integer, format: int64, description: 售后涉及金额（分）；退款类为订单实付 }
        handlerBy: { type: string, description: 处置人（后台账号），未处置为 null }
        handleRemark: { type: string, description: 处置说明，驳回时必填 }
        handleTime: { type: integer, format: int64, description: 毫秒时间戳 }
        createTime: { type: integer, format: int64, description: 毫秒时间戳 }

    RefundVO:
      type: object
      description: |
        退款单。**钱是否真的退回去了以本表 status 为准**，订单状态 REFUNDING 只是"处理中"。
        金额单位分，时间毫秒时间戳。
      properties:
        refundNo: { type: string }
        orderNo: { type: string }
        amount: { type: integer, format: int64, description: 退款金额（分） }
        reason: { type: string }
        status: { type: string, enum: [INIT, SUCCESS, FAILED] }
        statusLabel: { type: string, description: 状态中文名，由后端枚举给出，前端只展示不翻译 }
        provider: { type: string, description: '渠道：mock / wechat' }
        providerTradeNo: { type: string, description: 渠道退款流水号 }
        failReason: { type: string, description: 最近一次失败原因 }
        retryCount: { type: integer, description: 已重试次数 }
        createTime: { type: integer, format: int64, description: 毫秒时间戳 }
        updateTime: { type: integer, format: int64, description: 毫秒时间戳 }

    AdminAfterSaleVO:
      description: 后台售后列表行 = C 端字段 + 订单上下文（会员手机号不返回，个保法最小化）
      allOf:
        - $ref: '#/components/schemas/AfterSaleVO'
        - type: object
          properties:
            memberId: { type: integer, format: int64 }
            orderStatus: { type: string, description: 订单当前状态，取自 OrderStatus 枚举，前端不得自带名单 }
            serviceName: { type: string }

    # ---------------- 后台订单 ----------------
    AdminOrderVO:
      type: object
      description: 后台订单列表行。手机号等敏感字段一律不返回（个保法最小化）。
      properties:
        orderId: { type: integer, format: int64 }
        orderNo: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusLabel:
          type: string
          description: 中文状态名，由后端从枚举取，前端勿自己维护映射表
        serviceName: { type: string }
        plateNo: { type: string }
        payAmount: { type: integer, format: int64, description: 实付金额，单位分 }
        memberId: { type: integer, format: int64 }
        siteId: { type: integer, format: int64 }
        communityId: { type: integer, format: int64 }
        appointTime: { type: integer, format: int64, description: 预约取车时间，毫秒 }
        createTime:
          type: string
          description: 后台此处返回格式化时间字符串（非毫秒），沿用若依列表习惯

    StatusOption:
      type: object
      description: 状态下拉项，来源是 OrderStatus 枚举（唯一真源）。
      properties:
        value: { type: string, description: 状态枚举名 }
        label: { type: string, description: 中文状态名 }

    EventOption:
      type: object
      description: |
        后台可触发的事件下拉项。列表由状态机规则表 × 后台白名单算出，
        前端据此渲染；confirmRequired 决定要不要弹二次确认框，
        哪些事件算「高危」由后端判定，前端不得自行复制一份。
      properties:
        value: { type: string, description: 事件枚举名 }
        label: { type: string, description: 中文事件名 }
        confirmRequired:
          type: boolean
          description: 为 true 时提交必须带 confirm=true

    AdminOrderAdvanceRequest:
      type: object
      required: [event]
      properties:
        event:
          type: string
          description: 事件名，取值来自同一订单的 event-options
          example: TAKE_KEY_BACK
        reason:
          type: string
          description: 推进原因，写入流转日志备查
        confirm:
          type: boolean
          description: 高危事件的二次确认勾选项

    AdminOrderCancelRequest:
      type: object
      properties:
        reason:
          type: string
          description: 取消原因，客服视角需留痕

    # ---------------- 后台会员 / 车辆 ----------------
    AdminMemberVO:
      type: object
      description: 会员列表行。手机号与 openid 只给脱敏值，后台也不出明文。
      properties:
        memberId: { type: integer, format: int64 }
        openidMasked: { type: string, example: oXx1B***************Ab }
        nickname: { type: string }
        phoneMasked: { type: string, example: 138****1234 }
        vehicleCount: { type: integer }
        orderCount: { type: integer }
        createTime: { type: string }

    AdminVehicleVO:
      type: object
      description: 车辆列表行。车牌不脱敏（客服需报车牌找车）。
      properties:
        vehicleId: { type: integer, format: int64 }
        memberId: { type: integer, format: int64 }
        plateNo: { type: string }
        brand: { type: string }
        color: { type: string }
        isNewEnergy: { type: string, enum: ['Y', 'N'], description: 是否新能源 }
        communityId: { type: integer, format: int64 }
        parkingNo: { type: string }
        createTime: { type: string }

    # ---------------- 后台服务项（商品） ----------------
    AdminServiceVO:
      type: object
      description: |
        后台服务项。与 C 端 ServiceVO 刻意分开：C 端只给对外可售字段且带算好的展示价，
        后台要能改原始价格与上下架，字段集合不同，不做复用。
      properties:
        serviceId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        serviceName: { type: string }
        priceAmount: { type: integer, format: int64, description: 价格，单位分 }
        workMinutes: { type: integer, description: 工时，分钟 }
        enabled: { type: string, enum: ['Y', 'N'], description: 是否上架 }
        createBy: { type: string }
        createTime: { type: string }
        updateBy: { type: string }
        updateTime: { type: string }
        remark: { type: string }
        items:
          type: array
          description: 服务内容清单
          items: { type: string }
        notIncluded:
          type: array
          description: 不包含项
          items: { type: string }
        notices:
          type: array
          description: 注意事项
          items: { type: string }
        sampleImages:
          type: array
          description: 样图（图片URL）
          items: { type: string }
        applicableModels: { type: string, description: 适用车型 }
        cover: { type: string, description: 封面图URL }

    AdminServiceRequest:
      type: object
      description: 新增/修改服务项的入参。金额为【分】，后台表单填元需在页面层换算。
      required: [serviceName, categoryId, priceAmount]
      properties:
        serviceId: { type: integer, format: int64, description: 新增时不传，修改时必传 }
        categoryId: { type: integer, format: int64 }
        serviceName: { type: string }
        priceAmount: { type: integer, format: int64, description: 价格，单位分 }
        workMinutes: { type: integer }
        enabled: { type: string, enum: ['Y', 'N'], default: 'Y' }
        remark: { type: string }
        items:
          type: array
          description: 服务内容清单
          items: { type: string }
        notIncluded:
          type: array
          description: 不包含项
          items: { type: string }
        notices:
          type: array
          description: 注意事项
          items: { type: string }
        sampleImages:
          type: array
          description: 样图（图片URL）
          items: { type: string }
        applicableModels: { type: string, description: 适用车型 }
        cover: { type: string, description: 封面图URL }

    WashSite:
      type: object
      description: 站点（中央站）
      properties:
        siteId: { type: integer, format: int64, description: 站点ID }
        siteName: { type: string, description: 站点名称 }
        dailyLimit: { type: integer, description: 单日产能上限，0 表示不限量 }
        depositDeadline: { type: string, description: 最晚存钥匙时间，如 23:30 }
        promiseReturnTime: { type: string, description: 承诺还车时间，如 次日 07:00 }
        businessStart: { type: string, description: 营业时段起（整点），如 19:00 }
        businessEnd: { type: string, description: 营业时段止，如 23:00 }
        serviceStatus: { type: string, description: 营业状态 OPEN/CLOSED }
        closedNotice: { type: string, description: 停业公告 }

    WashCommunity:
      type: object
      description: 已开通小区
      properties:
        communityId: { type: integer, format: int64, description: 小区ID }
        communityName: { type: string, description: 小区名称 }
        siteId: { type: integer, format: int64, description: 所属站点ID }
        accessAuth: { type: string, description: 地库授权 Y/N，N 时禁止该小区下单 }
        enabled: { type: string, description: 启用状态 Y/N }

    CategoryOption:
      type: object
      description: 分类下拉项，来源是 wash_service_category 表。
      properties:
        value: { type: integer, format: int64 }
        label: { type: string }

    # ---------------- 后台师傅管理 ----------------
    WorkerStatus:
      type: string
      description: |
        师傅状态，取值必须与 wash_worker.status 及后端枚举完全一致。
        禁用 DISABLED 后：不能登录、token 失效，但不影响其历史任务追溯。
      enum:
        - NORMAL    # 正常
        - DISABLED  # 已禁用

    AdminWorkerVO:
      type: object
      description: |
        后台师傅列表行。**不含 password 字段**——密码永不出现在任何后台响应里。
      properties:
        workerId: { type: integer, format: int64 }
        workerNo: { type: string, description: 工号，登录账号 }
        name: { type: string }
        phone: { type: string }
        siteId: { type: integer, format: int64 }
        siteName: { type: string, description: 由服务端关联查出，前端不做 id→名称映射 }
        status: { $ref: '#/components/schemas/WorkerStatus' }
        statusLabel:
          type: string
          description: 中文状态名，由后端给出，前端勿自维护映射表
        createTime: { type: string }

    AdminWorkerRequest:
      type: object
      required: [workerNo, name]
      description: |
        新增/修改师傅的入参。
        注意：**修改时不接受 password**（改密码走 reset-password 接口），
        避免运营在改资料时误触密码把师傅锁在门外。
      properties:
        workerId: { type: integer, format: int64, description: 新增时不传，修改时必传 }
        workerNo: { type: string }
        password: { type: string, description: 仅新增时必填（初始密码） }
        name: { type: string }
        phone: { type: string }
        siteId: { type: integer, format: int64, description: 所属站点，用于任务池过滤 }
        status: { $ref: '#/components/schemas/WorkerStatus' }

    AdminWorkerPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 6
          description: 新密码，至少 6 位

    # ---------------- 后台看板 ----------------
    StatusCountVO:
      type: object
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        label: { type: string, description: 中文状态名 }
        count: { type: integer, format: int64 }

    DashboardStatsVO:
      type: object
      description: 纯只读聚合的口径由后端唯一定义，前端只渲染不二次计算。
      properties:
        todayOrderCount: { type: integer, format: int64, description: 今日下单数，按 create_time 计 }
        washingCount: { type: integer, format: int64, description: 作业中 }
        waitingKeyCount: { type: integer, format: int64, description: 待存钥匙 }
        abnormalCount: { type: integer, format: int64, description: 异常：退款中，需人工跟进 }
        statusBreakdown:
          type: array
          items: { $ref: '#/components/schemas/StatusCountVO' }
