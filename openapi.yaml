  # ============================ 影像证据 ============================
  /api/v1/media/upload:
    post:
      tags: [order]
      summary: 上传影像证据
      description: |
        multipart 上传。大小与类型限制由服务端配置（wash.media），前端不要自行放宽。
        bizType 决定这张图属于哪个环节（停车 / 取车 / 洗后 / 还车 / 对比 / 视频）。

        **orderNo 是影像归属的唯一依据**：凡能拿到订单号的环节（取车 PICK / 洗后 WASHED / 停放 RETURN）
        必须传，否则这条影像是无主的，后续「校验影像属于本单」时查不到，会返回 B1005。
        唯一例外是下单前传的停车照（PARK）——此时订单号还没生成，按「本人 + PARK + 尚未绑定订单」校验，
        下单成功时由服务端把 orderNo 回填到这些影像上。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, bizType]
              properties:
                file: { type: string, format: binary }
                bizType:
                  type: string
                  enum: [PARK, PICK, WASHED, RETURN, COMPARE, VIDEO, WORKER_QUAL]
                orderNo: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MediaVO'

  /api/v1/media/{fileId}/raw:
    get:
      tags: [order]
      summary: 读取影像原文件
      description: |
        需登录；服务端按 fileId 定位文件，不向前端暴露磁盘路径。
        小程序 image / previewImage 组件无法携带 Authorization 头，故支持 query 参数 token
        （与 header 二选一）。token 进 URL 有被日志记录的风险，只用于图片读取这个低敏场景，
        其余接口一律走 header。
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: false
          description: 访问令牌；供 image / previewImage 等无法带 header 的场景使用
          schema: { type: string }
      responses:
        '200':
          description: 文件流
          content:
            image/*:
              schema: { type: string, format: binary }
            video/*:
              schema: { type: string, format: binary }

