  # ============================ 师傅端流转接口（取送 + 作业合并） ============================
  # 师傅端 = 原「取送端」+「作业端」合并后的单一工作人员 App（详见《订单状态机规则表.md》端合并说明）
  # 所有接口需已登录且角色为「师傅」；照片均先经 POST /api/v1/media/upload 上传，再以 fileId 引用

  /api/v1/pick/tasks:
    get:
      tags: [master-pick]
      summary: 师傅任务池（待取 / 待送）
      description: |
        返回当前师傅可见的待取车（KEY_IN / PICKING / TO_STATION）与待送回（WAIT_RETURN / RETURNING）订单列表。
        待取车必须从 KEY_IN 起：师傅先从柜中取走钥匙（take-key），才有后续取车动作；
        少了 KEY_IN 师傅在任务池里看不到单，取钥匙就没有入口。
      parameters:
        - name: stage
          in: query
          schema: { type: string, enum: [PICKUP, RETURN, ALL] }
          description: PICKUP=待取车；RETURN=待送回；ALL=全部（默认）
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PickTaskVO' }

  /api/v1/pick/pool:
    get:
      tags: [master-pick]
      summary: 待派单池（师傅可抢单）
      description: |
        本站点、尚未派单的订单。自动派单没有合格候选（无人在线/资质未过/不在班）时订单留在这里，
        在线且资质合格的师傅可抢单；运营也可在后台手动派单。
      parameters:
        - name: stage
          in: query
          schema: { type: string, enum: [PICKUP, RETURN, ALL] }
      responses:
        '200':
          description: 待派单列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PickTaskVO' }

  /api/v1/pick/orders/{orderNo}/claim:
    post:
      tags: [master-pick]
      summary: 抢单
      description: |
        条件更新保证并发下只有一人成功；被别人先抢走返回 B1002，前端提示"手慢了"。
        要求：账号正常、已打卡上班、资质通过（人脸核身 + 后台审核）、同站点。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/pick/orders/{orderNo}/pick-car-done:
    post:
      tags: [master-pick]
      summary: 取车拍照完成（触发 PICK_CAR_DONE）
      description: |
        触发状态机 PICK_CAR_DONE：PICKING → TO_STATION。
        **必填 ≥6 张 360° 照片 + 仪表盘**（bizType=PICK），否则后端拒绝。详见《订单状态机规则表.md》。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileIds]
              properties:
                fileIds:
                  type: array
                  items: { type: string }
                  minItems: 6
                  description: |
                    上传后的 fileId 列表，bizType=PICK。
                    服务端校验每个 fileId 真实存在、属于本单且 bizType=PICK，不通过返回 B1005
                    （只校验数量时，传任意字符串都能推进状态）。
                note: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/pick/orders/{orderNo}/return-done:
    post:
      tags: [master-pick]
      summary: 送回停放完成 + 钥匙归柜（触发 RETURN_DONE）
      description: |
        触发状态机 RETURN_DONE：RETURNING → RETURNED。
        **必填停放照（含车位号）**（bizType=RETURN），否则后端拒绝。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileIds, parkingNo]
              properties:
                fileIds:
                  type: array
                  items: { type: string }
                  description: |
                    停放照 fileId 列表，bizType=RETURN。
                    服务端校验每个 fileId 真实存在、属于本单且 bizType=RETURN，不通过返回 B1005。
                parkingNo: { type: string, description: 车位号 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/station/queue:
    get:
      tags: [master-station]
      summary: 中央站工位队列看板
      description: |
        返回中央站作业台：待入场（TO_STATION）、清洗中（WASHING）、待质检（QC）、待还车（WAIT_RETURN）订单。
        WASHING 进 bays，其余进 waiting，前端按 status 分栏渲染并给出对应动作（入场 / SOP / 质检 / 驶离）。
        只返回 WASHING / QC 会让 arrive 与 leave 没有入口。
      responses:
        '200':
          description: 工位队列
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    $ref: '#/components/schemas/StationQueueVO'

  /api/v1/station/orders/{orderNo}/sop-done:
    post:
      tags: [master-station]
      summary: SOP 全部完成（触发 SOP_DONE）
      description: 触发状态机 SOP_DONE：WASHING → QC；15 步打卡明细后端按 step 记录，这里汇总提交
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                steps:
                  type: array
                  items: { type: string }
                  description: 已完成的 15 步 SOP 步骤标识
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/station/orders/{orderNo}/qc-pass:
    post:
      tags: [master-station]
      summary: 质检通过（触发 QC_PASS）
      description: |
        触发状态机 QC_PASS：QC → WAIT_RETURN。
        **必填洗后照**（bizType=WASHED，前后对比图由后端自动拼），否则后端拒绝。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileIds]
              properties:
                fileIds:
                  type: array
                  items: { type: string }
                  description: |
                    洗后照 fileId 列表，bizType=WASHED。
                    服务端校验每个 fileId 真实存在、属于本单且 bizType=WASHED，不通过返回 B1005。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/station/orders/{orderNo}/qc-fail:
    post:
      tags: [master-station]
      summary: 质检不合格（触发 QC_FAIL）
      description: 触发状态机 QC_FAIL：QC → WASHING；必填原因，重洗次数 +1，≥2 次自动生成复盘工单
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/pick/orders/{orderNo}/open-code:
    post:
      tags: [master-pick]
      summary: 师傅取钥匙开箱码（扫码为主、码兜底）
      description: |
        师傅从柜中取出客户钥匙前的开箱凭证，仅「钥匙已入柜 KEY_IN」可调用，师傅端鉴权（WorkerContext）。
        带 slotNo = 扫码开箱：服务端校验扫码格口与本单格口一致（一物一码，防止开错柜），不一致返回 B2005。
        不带 slotNo = 备用开箱码兜底（扫码失败、柜机离线时到柜机键盘输码）。
        开箱码 10 分钟有效、一次有效；取码即写开箱留痕（角色=工作人员），重复取码不重置时效。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slotNo:
                  type: string
                  description: 扫柜机格口二维码得到的格口号；传了就做格口匹配校验
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OpenCodeVO'

  /api/v1/pick/orders/{orderNo}/take-key:
    post:
      tags: [master-pick]
      summary: 取钥匙（触发 TAKE_KEY）
      description: |
        触发状态机 TAKE_KEY：KEY_IN → PICKING。师傅从柜中取出客户钥匙、开始取车作业。
        **必带开箱码 code**：服务端校验一致才推进状态（一次有效，不符返回 B2004），
        通过后写开箱留痕（角色=工作人员、人员=当前师傅、来源端=师傅小程序）。
        正式环境该动作应由柜机开箱回执驱动（PRD 6.2），MVP 无柜机，由师傅在开箱页确认后提交。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6 位开箱码，一次有效
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/station/orders/{orderNo}/arrive:
    post:
      tags: [master-station]
      summary: 入场打卡（触发 ARRIVE_STATION）
      description: 触发状态机 ARRIVE_STATION：TO_STATION → WASHING；记录到站点时间。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/station/orders/{orderNo}/leave:
    post:
      tags: [master-station]
      summary: 驶离站点（触发 LEAVE_STATION）
      description: 触发状态机 LEAVE_STATION：WAIT_RETURN → RETURNING；记录离站时间。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  # ============================================================================
  # 运营后台（/admin-api，若依 JWT 鉴权）
  # 返回体与 /api/v1 不同：成功码 200、分页为 { total, rows }，详见 info.description。
  # x-permission 为 PRD 6.7.3 的 wash:*:* 标识，后端 @PreAuthorize 与本文件必须一致。
  # ============================================================================
  /admin-api/wash/order/list:
    get:
      tags: [admin-order]
      summary: 后台订单列表（全量视图）
      description: |
        后台看得到所有站点的订单，不做 tab 分组（分组规则 '/api/v1/orders' 与这里是两套，勿复用）。
        敏感字段（手机号等）一律不返回。
      x-permission: wash:order:list
      parameters:
        - name: orderNo
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: 取值必须来自 GET /admin-api/wash/order/status-options，前端不得自带一份状态名单
          schema: { type: string }
        - name: memberId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/AdminOrderVO' }

  /admin-api/wash/order/status-options:
    get:
      tags: [admin-order]
      summary: 订单状态下拉选项
      description: 由后端 OrderStatus 枚举直接生成，是状态名单的唯一真源。
      x-permission: wash:order:list
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StatusOption' }

  /admin-api/wash/order/{orderNo}:
    get:
      tags: [admin-order]
      summary: 后台订单详情
      description: |
        含 C 端同款 8 节点时间轴（直接读 wash_order_status_log 生成，不另写一套进度表）。
        与 GET /api/v1/orders/{orderNo} 返回同一个 OrderDetailVO，避免两端字段漂移。
      x-permission: wash:order:query
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderDetailVO' }

  /admin-api/wash/order/{orderNo}/event-options:
    get:
      tags: [admin-order]
      summary: 当前状态允许触发的事件选项
      description: |
        由状态机规则表（OrderStatusTransitions）+ 后台白名单共同算出，
        客服下拉里只会出现真正能推进成功的事件；confirmRequired 由后端判定后下发，
        前端只负责是否弹二次确认框，不得自行维护一份「哪些事件危险」的名单。
      x-permission: wash:order:edit
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EventOption' }

  /admin-api/wash/order/{orderNo}/advance:
    post:
      tags: [admin-order]
      summary: 人工推进订单状态（异常补救）
      description: |
        必须走状态机（WashOrderStateService.adminFire），非法事件直接被拒绝并写流转日志。
        高危事件（isConfirmRequired=true）必须带 confirm=true，否则返回业务失败。
        TODO（上线前）：目前客服可一步推到「已完成」，需收紧允许后台触发的事件集合。
      x-permission: wash:order:edit
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOrderAdvanceRequest' }
      responses:
        '200':
          description: 成功；data 为推进后的状态枚举名
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderStatus' }

  /admin-api/wash/order/{orderNo}/cancel:
    post:
      tags: [admin-order]
      summary: 后台取消订单
      description: 不受「客户只能取消车未动」的限制，但终态仍不可取消——由状态机兜底。
      x-permission: wash:order:edit
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOrderCancelRequest' }
      responses:
        '200':
          description: 成功；data 为取消后的状态枚举名
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderStatus' }

  /admin-api/wash/member/list:
    get:
      tags: [admin-member]
      summary: 后台会员列表
      description: 手机号与 openid 仅返回脱敏值（个保法最小化，技术方案 P8），后台也不暴露明文。
      x-permission: wash:member:list
      parameters:
        - name: keyword
          in: query
          required: false
          description: 昵称 / 手机号模糊匹配
          schema: { type: string }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/AdminMemberVO' }

  /admin-api/wash/vehicle/list:
    get:
      tags: [admin-member]
      summary: 后台车辆列表
      description: 车牌属于个人信息，但客服需要报车牌找车，故按会员维度展示且不做脱敏。
      x-permission: wash:vehicle:list
      parameters:
        - name: plateNo
          in: query
          required: false
          schema: { type: string }
        - name: memberId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/AdminVehicleVO' }

  /admin-api/wash/service/list:
    get:
      tags: [admin-goods]
      summary: 后台服务项列表
      description: 与 C 端不同——包含已下架项，供后台修改/重新上架。
      x-permission: wash:service:list
      parameters:
        - name: serviceName
          in: query
          required: false
          schema: { type: string }
        - name: categoryId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiTableDataInfo'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/AdminServiceVO' }

  /admin-api/wash/service/category-options:
    get:
      tags: [admin-goods]
      summary: 服务分类下拉选项
      description: 来源 wash_service_category 表，前端不得自带一份分类名单。
      x-permission: wash:service:list
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CategoryOption' }

  /admin-api/wash/service/{serviceId}:
    get:
      tags: [admin-goods]
      summary: 服务项详情
      x-permission: wash:service:list
      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminServiceVO' }
    delete:
      tags: [admin-goods]
      summary: 删除服务项（逻辑删除）
      description: 历史订单仍引用服务名与价格快照，因此只能逻辑删除，禁止物理删行。
      x-permission: wash:service:remove
      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/service:
    post:
      tags: [admin-goods]
      summary: 新增服务项
      description: 金额单位为【分】；后台表单填元，换算在页面层完成，后端不接收「元」。
      x-permission: wash:service:add
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminServiceRequest' }
      responses:
        '200':
          description: 成功；data 为新增后的服务项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminServiceVO' }
    put:
      tags: [admin-goods]
      summary: 修改服务项（含改价 / 上下架）
      description: |
        改价只影响新订单：历史订单用的是下单时的价格快照，不会被追溯修改。
        serviceId 必填，缺失视为新增（幂等键不适用本接口，重复提交会产生多次修改）。
      x-permission: wash:service:edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminServiceRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuoYiResult' }

  /admin-api/wash/dashboard/stats:
    get:
      tags: [admin-dashboard]
      summary: 经营数据看板
      description: 纯只读聚合，不写状态、不留痕；统计口径由后端唯一定义，前端只渲染不二次计算。
      x-permission: wash:dashboard:list
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DashboardStatsVO' }

  # ========================= 储值钱包（后台） =========================
  /admin-api/wash/wallet/gift-rules:
    get:
      tags: [admin-wallet]
      summary: 充值赠送规则列表（含停用）
      x-permission: wash:wallet:list
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RuoYiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            ruleId: { type: integer, format: int64 }
                            rechargeFen: { type: integer, format: int64, description: '充值门槛（分）' }
