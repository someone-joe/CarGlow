  # ============================ 评价 / 售后 ============================
  /api/v1/orders/{orderNo}/reviews:
    post:
      tags: [aftersale]
      summary: 提交评价
      description: 走状态机 REVIEW_SUBMIT 事件（WAIT_REVIEW → FINISHED）。≤4 星强制填原因并生成复盘工单。
      parameters:
