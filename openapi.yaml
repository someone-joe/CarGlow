openapi: 3.0.3

# =============================================================================
# 夜间代客洗车平台 API 契约（SSOT · 唯一事实来源）
#
# 本文件是前后端接口的唯一定义处。
#   - 前端：npx openapi-typescript openapi.yaml -o carwash-mp/src/api/schema.d.ts
#   - 后端：openapi-generator generate -i openapi.yaml -g spring -o build/generated
#          （V1.0 先用 springdoc 生成实际文档与本文件做 diff 校验）
# 任何接口变更必须先改本文件，再改代码。字段不一致 = 漂移，必须修到一致。
#
# 上游：《洗车项目PRD V2.0》第六章；《洗车项目技术方案.md》第六章；《订单状态机规则表.md》
# =============================================================================

info:
  title: 夜间代客洗车平台 API
  version: 1.0.0
  description: |
    V1.0 MVP 接口契约。

    **全局约定**
    - 金额：整数，单位【分】。前端展示时除以 100。
    - 时间：毫秒时间戳（number）。时区 Asia/Shanghai。
    - 统一响应体 `{ code, msg, data }`，code = 0 表示成功，非 0 为错误码。
    - 分页响应：data = `{ list, total, pageNum, pageSize }`。
    - 幂等：下单、支付、开箱、分配格口四类接口必须传 `Idempotency-Key` 请求头。

    **路径前缀**
    - `/api/v1/**` C 端与 B 端小程序（wx-token 鉴权）
    - `/admin-api/**` 运营后台（若依 JWT 鉴权，本文件 V1.0 不展开）
    - `/device-callback/v1/**` 钥匙柜回调（签名 + IP 白名单，见 x-roadmap）
  contact:
    name: CarGlow

servers:
  - url: https://{host}
    variables:
      host:
        default: api.carglow.local
        description: 部署域名，上线后替换

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 登录授权
  - name: site
    description: 站点 / 小区 / Banner
  - name: goods
    description: 服务分类与服务项
  - name: cabinet
    description: 钥匙柜与格口
  - name: vehicle
    description: 车辆管理
  - name: order
    description: 下单 / 订单 / 进度
  - name: pay
    description: 支付
  - name: aftersale
    description: 评价 / 售后 / 理赔
  - name: misc
    description: 客服 / 条款等配置
  - name: coupon
    description: C 端优惠券（领券中心 / 我的券 / 下单最优券）
  - name: insurance
    description: C 端保险（产品 / 投保 / 我的保单）

# -----------------------------------------------------------------------------
# 错误码（分段：A0 通用 / B1 订单 / B2 柜机格口 / B3 支付 / B4 任务 / C0 第三方 / C1 营销 / C2 保险）
# -----------------------------------------------------------------------------
x-error-codes:
  A0001: 参数错误
  A0002: 未登录或登录已过期
  A0003: 无权限
  A0004: 请求过于频繁
  A0005: 系统繁忙，请稍后重试
  A0006: 当晚产能已满，请改约其他日期
  B1001: 订单不存在
  B1002: 订单状态不允许该操作
  B1003: 未到存钥匙时间 / 已过截止时间
  B1004: 取消原因必填
  B2001: 柜机离线
  B2002: 格口已被占用
  B2003: 无空闲格口
  B2004: 开箱码无效或已失效
  B2005: 开箱失败，请重试或联系客服
  B3001: 支付超时
  B3002: 支付失败
  B3003: 退款失败
  B4001: 任务已被他人接单
  B4002: 照片数量不足
  C0001: 第三方服务异常
  C1001: 优惠券已领完或已下架
  C1002: 超过每人领取上限
  C1003: 优惠券不可用（已使用/已过期/不满足门槛）
  C2001: 保险产品不存在或已下架
  C2002: 投保车辆必填
  # ---------------- 师傅端（工作人员）错误码（D 段 → 数字前缀 4） ----------------
  D4001: 工号不存在
  D4002: 密码或验证码错误
  D4003: 师傅账号已被禁用
  D4004: 师傅未绑定站点

# -----------------------------------------------------------------------------
# 后续模块开工前必须先补契约（防止边写边定，导致漂移）
# -----------------------------------------------------------------------------
x-roadmap:
  - 师傅端（取送）/api/v1/pick/** ：任务池、接单、取车/还车打卡、异常上报、工作量
  - 师傅端（作业）/api/v1/station/** ：工位队列看板、15 步 SOP 打卡、质检、产能预警
  - 设备回调 /device-callback/v1/** ：注册心跳、格口状态同步、开箱回调、开关门上报、故障告警
  - 后台 /admin-api/** ：模块 1-7 的 CRUD 与订单干预

paths:
  # ============================ 登录授权 ============================
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 微信小程序登录
      description: code2session 换 openid/unionid，返回访问令牌。首次登录返回是否需弹协议。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: wx.login 获取的临时凭证
                phoneCode:
                  type: string
                  description: 手机号快速验证组件 code，未授权手机号时不传
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginVO'

  /api/v1/worker/login:
    post:
      tags: [worker]
      summary: 师傅工号登录
      description: |
        师傅端入口。工号 + 密码登录（MVP 先密码，后续可换短信码）。
        返回带 role=WORKER 的访问令牌，与 C 端微信登录令牌隔离。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerNo, password]
              properties:
                workerNo: { type: string, description: 工号 }
                password: { type: string, description: 登录密码 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WorkerLoginVO'

  /api/v1/auth/agreements:
    get:
      tags: [auth]
      summary: 获取协议富文本
      security: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [SERVICE, PRIVACY, RECHARGE, INSURANCE]
            description: 服务条款 / 隐私政策 / 充值协议 / 保险与理赔说明
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          title: { type: string }
                          content: { type: string, description: 富文本 HTML }

  # ============================ 站点 / 小区 ============================
  /api/v1/site/current:
    get:
      tags: [site]
      summary: 当前站点与小区信息
      description: 对应 PRD P1 顶部站点栏「泷景花园 · 泷景中央站」
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SiteVO'

  /api/v1/communities:
    get:
      tags: [site]
      summary: 已开通小区列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CommunityVO'

  /api/v1/community-applies:
    post:
      tags: [site]
      summary: 申请开通我的小区
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [communityName]
              properties:
                communityName: { type: string }
                contactPhone: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/banners:
    get:
      tags: [site]
      summary: 首页 Banner 与公告
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BannerVO'

  /api/v1/capacity:
    get:
      tags: [site]
      summary: 今晚剩余产能
      description: 对应 PRD P1 产能条「今晚剩余 8 个名额 · 最晚 23:00 存钥匙」
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
            description: 默认今天
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CapacityVO'

  # ============================ 服务商品 ============================
  /api/v1/service-categories:
    get:
      tags: [goods]
      summary: 服务分类（洗车服务 / 美容服务）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceCategoryVO'

  /api/v1/services:
    get:
      tags: [goods]
      summary: 服务项列表
      parameters:
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceVO'

  /api/v1/services/{serviceId}:
    get:
      tags: [goods]
      summary: 服务项详情
      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceDetailVO'

  # ============================ 钥匙柜 ============================
  /api/v1/cabinets:
    get:
      tags: [cabinet]
      summary: 机柜列表（含空闲格口数与距离）
      parameters:
        - $ref: '#/components/parameters/CommunityId'
        - name: keyword
          in: query
          description: 楼栋/单元模糊搜索
          schema: { type: string }
        - name: lng
          in: query
          schema: { type: number }
        - name: lat
          in: query
          schema: { type: number }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CabinetVO'

  # ============================ 车辆 ============================
  /api/v1/vehicles:
    get:
      tags: [vehicle]
      summary: 我的车辆列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VehicleVO'
    post:
      tags: [vehicle]
      summary: 新增车辆
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/vehicles/{vehicleId}:
    put:
      tags: [vehicle]
      summary: 修改车辆
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
    delete:
      tags: [vehicle]
      summary: 删除车辆（前端需二次确认）
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # ============================ 订单 ============================
  /api/v1/orders:
    post:
      tags: [order]
      summary: 提交订单
      description: |
        后端按顺序校验：格口可用 → 产能未超 → 车辆/地址/机柜/协议齐全。
        成功后生成 WAIT_PAY 订单并预占格口（TTL 15 分钟，与支付倒计时一致）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateOrderVO'
    get:
      tags: [order]
      summary: 我的订单列表（三 Tab）
      parameters:
        - name: tab
          in: query
          schema:
            type: string
            enum: [ONGOING, WAIT_REVIEW, ALL]
            default: ONGOING
            description: 进行中 / 待评价 / 全部
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/OrderListItemVO'
                          total: { type: integer, format: int64 }
                          pageNum: { type: integer }
                          pageSize: { type: integer }

  /api/v1/orders/{orderNo}:
    get:
      tags: [order]
      summary: 订单详情（含 8 节点时间轴与证据）
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetailVO'

  /api/v1/orders/{orderNo}/cancel:
    post:
      tags: [order]
      summary: 取消订单
      description: |
        走状态机 CANCEL 事件。客户自助仅限 WAIT_PAY / WAIT_KEY / KEY_IN / PICKING，
        其余状态返回 B1002。取消后释放格口、回补产能、返还权益并自动触发退款。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/orders/{orderNo}/open-code:
    post:
      tags: [order]
      summary: 获取开箱码（存/取钥匙）
      description: |
        仅「待存钥匙 WAIT_KEY」与「已送回 RETURNED」两个环节可调用，后端按订单状态自行判定存/取，
        前端无需传 action。开箱码 10 分钟内有效，仅可使用一次（取码即写入开箱留痕，明文不留库）。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OpenCodeVO'

  /api/v1/orders/{orderNo}/emergency-take-key:
    post:
      tags: [order]
      summary: 紧急取钥匙
      description: |
        未取车 → 立即告警 + 取消 + 全额退款；
        已在清洗 → 返回预计完成时间并拒绝取回（错误码 B1002）。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # ============================ 支付 ============================
  /api/v1/payments/{orderNo}/prepay:
    post:
      tags: [pay]
      summary: 获取微信支付参数
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          timeStamp: { type: string }
                          nonceStr: { type: string }
                          package: { type: string }
                          signType: { type: string }
                          paySign: { type: string }
                          expireAt:
                            type: integer
                            format: int64
                            description: 支付截止时间（毫秒时间戳），前端倒计时以此为准

  /device-callback/v1/slot/deposit:
    post:
      tags: [device]
      summary: 柜机回调：钥匙已存入
      description: |
        客户凭开箱码打开格口并放入钥匙后，柜机回调本接口，触发状态机 DEPOSIT_KEY（WAIT_KEY → KEY_IN）。
        生产环境必须校验柜机签名 + IP 白名单（当前实现仅校验开箱码，接入硬件时补签名校验）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNo, code]
              properties:
                orderNo: { type: string }
                code: { type: string, description: 6 位开箱码 }
                slotNo: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/payments/wechat/notify:
    post:
      tags: [pay]
      summary: 微信支付结果回调
      description: |
        由微信支付服务器调用，无需登录态。必须：① 验签 ② 幂等（同一通知多次到达只处理一次）
        ③ 成功后调状态机 PAY_SUCCESS。
        本地开发（provider=mock）可直接 POST 该接口模拟回调。
      security: []
      responses:
        '200':
          description: 成功（返回给微信的应答）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }

  # ============================ 支付（开发用） ============================
  /api/v1/payments/{orderNo}/mock-pay:
    post:
      tags: [pay]
      summary: 模拟支付成功（仅本地开发）
      description: |
        开发期替代微信支付回调，触发状态机 PAY_SUCCESS 事件（WAIT_PAY → WAIT_KEY）。
        由配置项 wash.pay.mock-enabled 控制，生产环境必须为 false，否则返回 A0003。
      x-dev-only: true
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PayResultVO'

  # ============================ 评价 / 售后 ============================
  /api/v1/orders/{orderNo}/reviews:
    post:
      tags: [aftersale]
      summary: 提交评价
      description: 走状态机 REVIEW_SUBMIT 事件（WAIT_REVIEW → FINISHED）。≤4 星强制填原因并生成复盘工单。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                tags:
                  type: array
                  items: { type: string }
                  description: 洗得干净 / 时效快 / 服务态度好 / 取送准时
                content: { type: string }
                images:
                  type: array
                  items: { type: string }
                  description: 已上传图片的 fileId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/v1/after-sales:
    post:
      tags: [aftersale]
      summary: 提交售后（重洗 / 退款 / 理赔）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNo, type]
              properties:
                orderNo: { type: string }
                type:
                  type: string
                  enum: [REWASH, REFUND, CLAIM]
                reason: { type: string }
                images:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ticketNo: { type: string }

  # ============================ 影像证据 ============================
  /api/v1/media/upload:
    post:
      tags: [order]
      summary: 上传影像证据
      description: |
        multipart 上传。大小与类型限制由服务端配置（wash.media），前端不要自行放宽。
        bizType 决定这张图属于哪个环节（停车 / 取车 / 洗后 / 还车 / 对比 / 视频）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, bizType]
              properties:
                file: { type: string, format: binary }
                bizType:
                  type: string
                  enum: [PARK, PICK, WASHED, RETURN, COMPARE, VIDEO]
                orderNo: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MediaVO'

  /api/v1/media/{fileId}/raw:
    get:
      tags: [order]
      summary: 读取影像原文件
      description: 需登录；服务端按 fileId 定位文件，不向前端暴露磁盘路径。
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 文件流
          content:
            image/*:
              schema: { type: string, format: binary }
            video/*:
              schema: { type: string, format: binary }

  # ============================ 客服 / 配置 ============================
  /api/v1/faqs:
    get:
      tags: [misc]
      summary: 常见问题标签与解答
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FaqVO'

  /api/v1/config/customer-service:
    get:
      tags: [misc]
      summary: 客服配置（企微二维码、双电话、夜间提示）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          wecomQrcodeUrl: { type: string }
                          platformPhone: { type: string }
                          stationPhone: { type: string }
                          nightTip: { type: string }

  # ============================ 优惠券（C 端） ============================
  /api/v1/coupons/center:
    get:
      tags: [coupon]
      summary: 领券中心
      description: 返回当前可领的券模板，含该会员已领数量与剩余库存。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CouponTemplateVO' }

  /api/v1/coupons/templates/{templateId}/receive:
    post:
      tags: [coupon]
      summary: 领取优惠券
      security: [{ bearerAuth: [] }]
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CouponUserVO' }

  /api/v1/coupons:
    get:
      tags: [coupon]
      summary: 我的优惠券
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [UNUSED, USED, EXPIRED] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CouponUserVO' }

  /api/v1/coupons/best:
    get:
      tags: [coupon]
      summary: 下单页算最优券
      description: 给定支付金额，返回可用且减免最多的券（可能为空）。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: amount
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: 待支付金额（分）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CouponBestVO' }

  # ============================ 保险 / 保单（C 端） ============================
  /api/v1/insurances/products:
    get:
      tags: [insurance]
      summary: 可投保产品列表
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/InsuranceProductVO' }

  /api/v1/insurances:
    get:
      tags: [insurance]
      summary: 我的保单
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/InsurancePolicyVO' }
    post:
      tags: [insurance]
      summary: 投保（dev 模式直接生效）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, vehicleId]
              properties:
                productId: { type: integer, format: int64 }
                vehicleId: { type: integer, format: int64 }
                orderNo: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InsurancePolicyVO' }

  # ============================ 师傅端流转接口（取送 + 作业合并） ============================
  # 师傅端 = 原「取送端」+「作业端」合并后的单一工作人员 App（详见《订单状态机规则表.md》端合并说明）
  # 所有接口需已登录且角色为「师傅」；照片均先经 POST /api/v1/media/upload 上传，再以 fileId 引用

  /api/v1/pick/tasks:
    get:
      tags: [master-pick]
      summary: 师傅任务池（待取 / 待送）
      description: |
        返回当前师傅可见的待取车（KEY_IN / PICKING / TO_STATION）与待送回（WAIT_RETURN / RETURNING）订单列表。
        待取车必须从 KEY_IN 起：师傅先从柜中取走钥匙（take-key），才有后续取车动作；
        少了 KEY_IN 师傅在任务池里看不到单，取钥匙就没有入口。
      parameters:
        - name: stage
          in: query
          schema: { type: string, enum: [PICKUP, RETURN, ALL] }
          description: PICKUP=待取车；RETURN=待送回；ALL=全部（默认）
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PickTaskVO' }

  /api/v1/pick/orders/{orderNo}/pick-car-done:
    post:
      tags: [master-pick]
      summary: 取车拍照完成（触发 PICK_CAR_DONE）
      description: |
        触发状态机 PICK_CAR_DONE：PICKING → TO_STATION。
        **必填 ≥6 张 360° 照片 + 仪表盘**（bizType=PICK），否则后端拒绝。详见《订单状态机规则表.md》。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileIds]
              properties:
                fileIds:
                  type: array
                  items: { type: string }
                  minItems: 6
                  description: 上传后的 fileId 列表，bizType=PICK
                note: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/pick/orders/{orderNo}/return-done:
    post:
      tags: [master-pick]
      summary: 送回停放完成 + 钥匙归柜（触发 RETURN_DONE）
      description: |
        触发状态机 RETURN_DONE：RETURNING → RETURNED。
        **必填停放照（含车位号）**（bizType=RETURN），否则后端拒绝。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileIds, parkingNo]
              properties:
                fileIds:
                  type: array
                  items: { type: string }
                  description: 停放照 fileId 列表，bizType=RETURN
                parkingNo: { type: string, description: 车位号 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/station/queue:
    get:
      tags: [master-station]
      summary: 中央站工位队列看板
      description: |
        返回中央站作业台：待入场（TO_STATION）、清洗中（WASHING）、待质检（QC）、待还车（WAIT_RETURN）订单。
        WASHING 进 bays，其余进 waiting，前端按 status 分栏渲染并给出对应动作（入场 / SOP / 质检 / 驶离）。
        只返回 WASHING / QC 会让 arrive 与 leave 没有入口。
      responses:
        '200':
          description: 工位队列
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    $ref: '#/components/schemas/StationQueueVO'

  /api/v1/station/orders/{orderNo}/sop-done:
    post:
      tags: [master-station]
      summary: SOP 全部完成（触发 SOP_DONE）
      description: 触发状态机 SOP_DONE：WASHING → QC；15 步打卡明细后端按 step 记录，这里汇总提交
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                steps:
                  type: array
                  items: { type: string }
                  description: 已完成的 15 步 SOP 步骤标识
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/station/orders/{orderNo}/qc-pass:
    post:
      tags: [master-station]
      summary: 质检通过（触发 QC_PASS）
      description: |
        触发状态机 QC_PASS：QC → WAIT_RETURN。
        **必填洗后照**（bizType=WASHED，前后对比图由后端自动拼），否则后端拒绝。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileIds]
              properties:
                fileIds:
                  type: array
                  items: { type: string }
                  description: 洗后照 fileId 列表，bizType=WASHED
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/station/orders/{orderNo}/qc-fail:
    post:
      tags: [master-station]
      summary: 质检不合格（触发 QC_FAIL）
      description: 触发状态机 QC_FAIL：QC → WASHING；必填原因，重洗次数 +1，≥2 次自动生成复盘工单
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/pick/orders/{orderNo}/take-key:
    post:
      tags: [master-pick]
      summary: 取钥匙（触发 TAKE_KEY）
      description: |
        触发状态机 TAKE_KEY：KEY_IN → PICKING。师傅从柜中取出客户钥匙、开始取车作业。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/station/orders/{orderNo}/arrive:
    post:
      tags: [master-station]
      summary: 入场打卡（触发 ARRIVE_STATION）
      description: 触发状态机 ARRIVE_STATION：TO_STATION → WASHING；记录到站点时间。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

  /api/v1/station/orders/{orderNo}/leave:
    post:
      tags: [master-station]
      summary: 驶离站点（触发 LEAVE_STATION）
      description: 触发状态机 LEAVE_STATION：WAIT_RETURN → RETURNING；记录离站时间。
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 小程序侧 wx-token；后台侧若依 token
    deviceSign:
      type: apiKey
      in: header
      name: X-Signature
      description: 柜机回调签名，配合 X-Device-No、X-Timestamp 与 IP 白名单

  parameters:
    PageNum:
      name: pageNum
      in: query
      schema: { type: integer, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, default: 10 }
    SiteId:
      name: siteId
      in: query
      required: false
      schema: { type: integer, format: int64 }
    CommunityId:
      name: communityId
      in: query
      required: false
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键，客户端生成 UUID，同一键重复提交返回首次结果
      schema: { type: string }

  schemas:

    CouponTemplateVO:
      type: object
      properties:
        templateId: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string, enum: [NORMAL, NEWBIE] }
        thresholdAmount: { type: integer, format: int64, description: 使用门槛（分） }
        discountAmount: { type: integer, format: int64, description: 减免金额（分） }
        perLimit: { type: integer }
        endTime: { type: integer, format: int64, description: 失效时间（毫秒） }
        remain: { type: integer, description: 剩余库存 }
        claimed: { type: integer, description: 当前会员已领数量 }

    CouponUserVO:
      type: object
      properties:
        couponUserId: { type: integer, format: int64 }
        templateId: { type: integer, format: int64 }
        name: { type: string }
        thresholdAmount: { type: integer, format: int64 }
        discountAmount: { type: integer, format: int64 }
        status: { type: string, enum: [UNUSED, USED, EXPIRED] }
        expireTime: { type: integer, format: int64 }
        orderNo: { type: string }

    CouponBestVO:
      type: object
      properties:
        couponUserId: { type: integer, format: int64 }
        discountAmount: { type: integer, format: int64 }

    InsuranceProductVO:
      type: object
      properties:
        productId: { type: integer, format: int64 }
        name: { type: string }
        priceAmount: { type: integer, format: int64, description: 保费（分） }
        coverageDesc: { type: string }

    InsurancePolicyVO:
      type: object
      properties:
        policyId: { type: integer, format: int64 }
        policyNo: { type: string }
        productId: { type: integer, format: int64 }
        name: { type: string }
        vehicleId: { type: integer, format: int64 }
        orderNo: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, CANCELED] }
        startTime: { type: integer, format: int64 }
        endTime: { type: integer, format: int64 }
        paidAmount: { type: integer, format: int64, description: 实付保费（分） }

    Result:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: |
            0 = 成功，非 0 见 x-error-codes。
            数字映射规则：分段字母转前缀（A=1 / B=2 / C=3）+ 4 位编号，
            即 A0002 → 10002、B1002 → 21002、C0001 → 30001。
          example: 0
        msg:
          type: string
          example: 操作成功
        data:
          description: 业务数据，各接口不同
        traceId:
          type: string
          description: 链路追踪 ID，排查问题时提供

    # ---------------- 订单状态（与 OrderStatus.java 必须逐条一致） ----------------
    OrderStatus:
      type: string
      description: |
        订单状态，取值必须与《订单状态机规则表.md》及 OrderStatus 枚举完全一致（15 个）。
      enum:
        - WAIT_PAY        # 待支付
        - WAIT_KEY        # 待存钥匙
        - KEY_IN          # 钥匙已入柜
        - PICKING         # 取车中
        - TO_STATION      # 运输中（去程）
        - WASHING         # 清洗中
        - QC              # 待质检
        - WAIT_RETURN     # 待还车
        - RETURNING       # 运输中（回程）
        - RETURNED        # 已还车（待取钥匙）
        - WAIT_REVIEW     # 待评价
        - FINISHED        # 已完成（终态）
        - CANCELED        # 已取消
        - REFUNDING       # 退款中
        - REFUNDED        # 已退款（终态）

    # ---------------- C 端时间轴 8 节点 ----------------
    TimelineNode:
      type: object
      properties:
        node:
          type: string
          enum: [ORDERED, KEY_IN, PICKED, ARRIVED, WASHING, QC_DONE, RETURNED, WAIT_TAKE_KEY]
          description: 已下单 / 钥匙已入柜 / 已取车 / 到达中央站 / 清洗中 / 质检完成 / 已还车 / 待取钥匙
        title: { type: string }
        time:
          type: integer
          format: int64
          description: 毫秒时间戳，未到达时为空
        reached: { type: boolean }
        current: { type: boolean }
        evidences:
          type: array
          description: 该节点的照片等证据
          items:
            $ref: '#/components/schemas/MediaVO'

    # ---------------- 师傅端（工作人员） ----------------
    WorkerLoginVO:
      type: object
      properties:
        token: { type: string }
        expireAt: { type: integer, format: int64 }
        workerId: { type: integer, format: int64 }
        workerNo: { type: string, description: 工号 }
        name: { type: string }
        siteId: { type: integer, format: int64 }
        siteName: { type: string }
        status: { type: string, enum: [NORMAL, DISABLED], description: 正常 / 禁用 }

    # ---------------- 登录 ----------------
    LoginVO:
      type: object
      properties:
        token: { type: string }
        expireAt: { type: integer, format: int64 }
        isNewUser: { type: boolean }
        needAgreement: { type: boolean, description: true 时前端弹《用户服务协议》《隐私政策》 }
        phoneBound: { type: boolean }

    # ---------------- 站点 / 小区 ----------------
    SiteVO:
      type: object
      properties:
        siteId: { type: integer, format: int64 }
        siteName: { type: string }
        communityId: { type: integer, format: int64 }
        communityName: { type: string }
        displayName:
          type: string
          description: 站点栏展示文案，如「泷景花园 · 泷景中央站」
        serviceStatus:
          type: string
          enum: [OPEN, CLOSED, RAINY]
          description: 正常 / 停业 / 雨天模式
        closedNotice: { type: string }

    CommunityVO:
      type: object
      properties:
        communityId: { type: integer, format: int64 }
        name: { type: string }
        accessAuth:
          type: boolean
          description: 地库通行授权，false 时禁止该小区下单
        enabled: { type: boolean }

    BannerVO:
      type: object
      properties:
        bannerId: { type: integer, format: int64 }
        imageUrl: { type: string }
        title: { type: string }
        linkType:
          type: string
          enum: [NONE, ACTIVITY, RECHARGE, SERVICE]
        linkValue: { type: string }
        sort: { type: integer }

    CapacityVO:
      type: object
      properties:
        date: { type: string, format: date }
        total: { type: integer }
        used: { type: integer }
        remaining: { type: integer }
        depositDeadline:
          type: string
          description: 最晚存钥匙时间，如 23:00
        promiseReturnTime:
          type: string
          description: 承诺还车时间，如 次日 07:00
        soldOut: { type: boolean }

    # ---------------- 商品 ----------------
    ServiceCategoryVO:
      type: object
      properties:
        categoryId: { type: integer, format: int64 }
        name:
          type: string
          example: 洗车服务
        sort: { type: integer }

    ServiceVO:
      type: object
      properties:
        serviceId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        name: { type: string }
        subtitle: { type: string }
        originPrice: { type: integer, description: 原价，单位分 }
        salePrice: { type: integer, description: 活动价，单位分 }
        memberPrice:
          type: integer
          description: 会员价，单位分；非会员为空
        displayPrice:
          type: integer
          description: 实际展示价，优先级 会员价 > 活动价 > 原价，由后端算好
        workMinutes: { type: integer }
        pickupFee:
          type: integer
          description: 取送车费，固定展示 0（卖点）
        dailyLimit: { type: integer }
        soldOut: { type: boolean, description: 今日已约满 }
        coverUrl: { type: string }

    ServiceDetailVO:
      allOf:
        - $ref: '#/components/schemas/ServiceVO'
        - type: object
          properties:
            items:
              type: array
              description: 服务内容清单
              items: { type: string }
            applicableModels: { type: string }
            notIncluded:
              type: array
              items: { type: string }
            notices:
              type: array
              items: { type: string }
            sampleImages:
              type: array
              items: { type: string }

    # ---------------- 钥匙柜 ----------------
    CabinetVO:
      type: object
      properties:
        cabinetId: { type: integer, format: int64 }
        name:
          type: string
          description: 命名规范 小区名+楼栋+单元+楼层，如「泷景花园 三号楼二单元负一」
        slotTotal: { type: integer }
        slotFree: { type: integer }
        online: { type: boolean }
        distance:
          type: integer
          description: 距您约多少米；未授权定位时为空
        full: { type: boolean }

    # ---------------- 车辆 ----------------
    VehicleVO:
      type: object
      properties:
        vehicleId: { type: integer, format: int64 }
        plateNo: { type: string }
        brand: { type: string }
        color: { type: string }
        photoUrl: { type: string }
        isNewEnergy: { type: boolean }
        isDefault: { type: boolean }
        address:
          $ref: '#/components/schemas/AddressVO'

    AddressVO:
      type: object
      properties:
        communityId: { type: integer, format: int64 }
        building: { type: string }
        unit: { type: string }
        floor:
          type: string
          example: 负一层
        parkingNo:
          type: string
          example: A 区 23 号车位

    VehicleRequest:
      type: object
      required: [plateNo]
      properties:
        plateNo: { type: string, description: 支持新能源 8 位 }
        brand: { type: string }
        color: { type: string }
        photoFileId: { type: string }
        isNewEnergy: { type: boolean }
        isDefault: { type: boolean }
        address:
          $ref: '#/components/schemas/AddressVO'

    # ---------------- 订单 ----------------
    CreateOrderRequest:
      type: object
      required: [serviceId, vehicleId, cabinetId, appointDate, appointTime, agreed]
      properties:
        serviceId: { type: integer, format: int64 }
        vehicleId: { type: integer, format: int64 }
        cabinetId: { type: integer, format: int64 }
        appointDate: { type: string, format: date }
        appointTime:
          type: string
          example: '19:00'
        pickupRequired:
          type: boolean
          default: true
          description: 是否需要取送车，V1.0 固定 true
        remark: { type: string, maxLength: 100 }
        parkPhotoFileIds:
          type: array
          maxItems: 3
          items: { type: string }
        agreed:
          type: boolean
          description: 已同意《服务条款与钥匙寄存协议》
        couponUserId:
          type: integer
          format: int64
          description: 使用的优惠券 ID（来自「我的优惠券」UNUSED 券），不传则不使用优惠券


    CreateOrderVO:
      type: object
      properties:
        orderNo:
          type: string
          example: SE202609151601276839838676768265
        status:
          $ref: '#/components/schemas/OrderStatus'
        payAmount: { type: integer, description: 应付金额，单位分（已扣除优惠券抵扣） }
        couponDiscount:
          type: integer
          format: int64
          description: 优惠券抵扣金额，单位分；未用券时为 0
        payExpireAt:
          type: integer
          format: int64
          description: 支付截止时间，毫秒时间戳

    OrderListItemVO:
      type: object
      properties:
        orderNo: { type: string }
        status:
          $ref: '#/components/schemas/OrderStatus'
        statusLabel: { type: string }
        serviceName: { type: string }
        workMinutes: { type: integer }
        appointTime: { type: integer, format: int64 }
        communityName: { type: string }
        plateNo: { type: string }
        payAmount: { type: integer }
        mainAction:
          $ref: '#/components/schemas/OrderAction'
        subActions:
          type: array
          items:
            $ref: '#/components/schemas/OrderAction'

    OrderDetailVO:
      type: object
      properties:
        orderNo: { type: string }
        status:
          $ref: '#/components/schemas/OrderStatus'
        statusLabel: { type: string }
        statusDesc:
          type: string
          example: 清洗中 · 预计次日 6:30 送回原位
        promiseReturnTime: { type: integer, format: int64 }
        overdue: { type: boolean }
        siteName: { type: string }
        cabinetName: { type: string }
        slotNo: { type: string, description: 仅本人可见 }
        plateNo: { type: string }
        address:
          $ref: '#/components/schemas/AddressVO'
        serviceName: { type: string }
        remark: { type: string }
        originAmount: { type: integer }
        discountAmount: { type: integer }
        payAmount: { type: integer }
        payType: { type: string }
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineNode'
        medias:
          type: array
          items:
            $ref: '#/components/schemas/MediaVO'
        mainAction:
          $ref: '#/components/schemas/OrderAction'
        subActions:
          type: array
          items:
            $ref: '#/components/schemas/OrderAction'

    PayResultVO:
      type: object
      description: 模拟支付返回（x-dev-only）
      properties:
        orderNo: { type: string }
        status:
          $ref: '#/components/schemas/OrderStatus'

    OrderAction:
      type: object
      description: 按钮随状态机变化，前端不得自行推断，一律用后端返回值
      properties:
        action:
          type: string
          enum: [PAY, DEPOSIT_KEY, VIEW_PROGRESS, TAKE_KEY, REVIEW, REORDER, CANCEL, CONTACT_SERVICE]
        label: { type: string }
        enabled: { type: boolean }

    OpenCodeVO:
      type: object
      properties:
        code:
          type: string
          description: 6 位取件码
        qrcodeUrl: { type: string }
        cabinetName: { type: string }
        slotNo: { type: string }
        expireAt: { type: integer, format: int64 }

    MediaVO:
      type: object
      properties:
        fileId: { type: string }
        bizType:
          type: string
          enum: [PARK, PICK, WASHED, RETURN, COMPARE, VIDEO]
        url:
          type: string
          description: 临时访问地址，带有效期
        uploadTime: { type: integer, format: int64 }

    # ---------------- 师傅端 VO ----------------
    PickTaskVO:
      type: object
      description: 任务池单项（取送端）
      properties:
        orderNo: { type: string }
        bizType: { type: string, enum: [PICKUP, RETURN], description: 待取车 / 待送回 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusLabel:
          type: string
          description: 状态中文名，由后端 OrderStatus 枚举给出；前端禁止自行翻译状态码
        parkPhotos:
          type: array
          description: 用户上传的停车照（bizType=PARK），师傅找车用；无照片时为空数组
          items: { $ref: '#/components/schemas/MediaVO' }
        serviceName: { type: string }
        vehiclePlate: { type: string, description: 车牌 }
        vehicleBrand: { type: string }
        vehicleColor: { type: string }
        customerName: { type: string, description: 客户称呼，脱敏 }
        customerPhone: { type: string, description: 联系电话，脱敏 }
        pickupAddr: { type: string }
        returnAddr: { type: string }
        appointmentDate: { type: string, format: date, description: 预约服务日 }
        promiseReturnTime: { type: string, description: 承诺还车时间，如 次日 07:00 }
        pickupDeadline: { type: string, description: 最晚存钥匙时间 }
        requiredPhotoCount: { type: integer, description: 取车需拍照片数（≥6） }
        distanceMeters: { type: integer, description: 距师傅当前位置约多少米；未定位时为空 }

    StationQueueVO:
      type: object
      description: 中央站工位队列看板项
      properties:
        stationId: { type: integer, format: int64 }
        stationName: { type: string }
        washingCount: { type: integer, description: 清洗中数量 }
        qcCount: { type: integer, description: 待质检数量 }
        bays:
          type: array
          description: 工位列表
          items:
            type: object
            properties:
              bayNo: { type: string, description: 工位号 }
              orderNo: { type: string }
              status: { $ref: '#/components/schemas/OrderStatus' }
              startedAt: { type: integer, format: int64, description: 进入该工位时间（毫秒） }
              sopStep: { type: integer, description: 当前 15 步 SOP 进度，WASHING 时有效 }
        waiting:
          type: array
          description: |
            非「在洗」的订单，含待入场（TO_STATION）/ 待质检（QC）/ 待还车（WAIT_RETURN）。
            status 必带：前端据此决定给出「入场 / 质检 / 驶离」哪个动作。
          items:
            type: object
            properties:
              orderNo: { type: string }
              serviceName: { type: string }
              status: { $ref: '#/components/schemas/OrderStatus' }
              queuedAt: { type: integer, format: int64 }

    FaqVO:
      type: object
      properties:
        faqId: { type: integer, format: int64 }
        label:
          type: string
          example: 无法打开柜门
        answer: { type: string }
        ticketType:
          type: string
          description: 绑定的工单类型，一键建单时带入
