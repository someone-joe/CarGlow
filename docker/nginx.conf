# CarGlow 边缘反向代理（Nginx 以 host 网络运行，转发到本机各应用栈暴露的 127.0.0.1 端口）。
#   api.<域名>      → prod 应用栈 127.0.0.1:8081
#   test-api.<域名> → test 应用栈 127.0.0.1:8082
#   admin.<域名>    → 后台前端静态 /usr/share/nginx/admin
# 端口与 docker/.env.*.example 的 APP_PORT 对应；改了 APP_PORT 需同步这里。
# 备案 + 证书就绪前先用 HTTP（下面 listen 80）；就绪后加 443 server 块并把 80 改为 301 跳转。

upstream carglow_prod { server 127.0.0.1:8081; }
upstream carglow_test { server 127.0.0.1:8082; }

# 后台前端（RuoYi-Vue3 构建产物，deploy.sh 放到 ./admin-dist）
server {
  listen 80;
  server_name admin.example.com;
  root /usr/share/nginx/admin;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}

# 生产：C 端 / 师傅端小程序接口
server {
  listen 80;
  server_name api.example.com;
  location / {
    proxy_pass http://carglow_prod;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;   # 对齐 multipart max-request-size
  }
}

# 测试环境接口（预演/联调）
server {
  listen 80;
  server_name test-api.example.com;
  location / {
    proxy_pass http://carglow_test;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
  }
}

